 aim to end the day close to flat."},{"type":"number","prompt":"Buy 10 at 50. Sell 4 at 52. The market is now 49. Total P and L?","answer":2,"tolerance":0,"explain":"Four sold: 4 × (52 − 50) = +8. Six still held, marked at 49: 6 × (49 − 50) = −6. Total +2, and you\'re long 6. Forget the six and you say +8 and look silly."},{"type":"mcq","prompt":"Sell 8 at 100. Buy back 3 at 97. What\'s your position now?","options":["Short 5","Long 5","Short 8","Flat"],"answer":0,"explain":"Start flat, sell 8: short 8. Buy 3 back: short 5. Short 8 forgets the buy-back; long 5 mixes up the direction."},{"type":"number","prompt":"Same trades: sell 8 at 100, buy back 3 at 97. The market is now 102. Total P and L?","answer":-1,"tolerance":0,"explain":"Three bought back: 3 × (100 − 97) = +9. Five still short from 100, marked at 102: 5 × (100 − 102) = −10. Total −1. Short and the price rose: ouch."}]},{"concept":{"term":"Expected value and edge","definition":"Expected value is the average outcome if you repeated something forever. Edge is your expected profit per trade: the gap between your price and fair value. Alpha is return beyond the market\'s. Sharpe is excess return per unit of volatility.","analogy":"A casino doesn\'t win every spin. It wins a few percent on average, millions of times. Edge means being the casino, not the stag do at the roulette table.","firm":{"name":"SIG","text":"Susquehanna (SIG) is well known for using poker to teach decisions under uncertainty: is this bet positive expected value, and how big should it be? Expect EV questions in almost every quant interview."},"interview":"\'Expected sum of three dice?\' Say it fast: 3.5 each, so 10.5. Then \'if I sell at 12, my edge is 1.5 per trade.\' No listing outcomes.","trap":"Confusing edge with outcome. You can make a good trade and lose, or a bad trade and win. Judge the decision.","quip":{"who":"EMMA","text":"Alpha is skill. Beta is just riding the market. Plenty of \'genius\' managers are beta in a nice suit."}},"exercises":[{"type":"number","prompt":"Expected sum of three fair six-sided dice?","answer":10.5,"tolerance":0,"explain":"One die: (1+2+3+4+5+6)/6 = 3.5. Expectations add, so three dice: 3 × 3.5 = 10.5. Linearity of expectation, no need to list 216 outcomes."},{"type":"tf","statement":"The Sharpe ratio is average return above the risk-free rate, divided by the volatility of returns.","answer":true,"explain":"Return per unit of risk. Higher is better. A fund making 30% while swinging like a pub sign in a storm can have a worse Sharpe than a calm 10%."},{"type":"number","prompt":"A fund returns 12% a year. The risk-free rate is 2%. Volatility is 20%. Sharpe ratio?","answer":0.5,"tolerance":0.01,"explain":"(12% − 2%) / 20% = 10 / 20 = 0.5. Don\'t forget to subtract the risk-free rate first: 12 / 20 = 0.6 is the classic slip."},{"type":"mcq","prompt":"You sell the three-dice sum at 12, one hundred separate times. Expected total profit?","options":["150","1,050","120","0, because dice are random"],"answer":0,"explain":"Edge per trade is 12 − 10.5 = 1.5. Over 100 trades: 150. Randomness changes each outcome, not the average. That\'s why market makers love volume."}]},{"concept":{"term":"The industry map","definition":"Sell side: banks that make markets and sell services to clients. Buy side: investors like pension funds and hedge funds. Prop shops trade only their own money; the famous ones are market makers. HFT is a style, not a firm type.","analogy":"Restaurant. The sell side is the waiter serving customers. The buy side is the diners spending money. A prop shop is a chef cooking for himself with his own cash.","firm":{"name":"Citadel","text":"Citadel (a multi-strategy hedge fund, or pod shop) and Citadel Securities (a market maker) are separate companies with the same founder. Mix them up in an interview and it looks like you did zero research."},"interview":"\'Why us rather than a hedge fund?\' Strong: say what the firm actually is (market maker, quant fund, bank) and why that model suits you. Weak: \'I like maths and money.\'","trap":"Thinking Jane Street manages pension money. Prop shops trade their own capital and have no outside clients.","quip":{"who":"GEORGE","text":"A pod shop sacks the team after a bad run. So, Sunday league with Bloomberg terminals."}},"exercises":[{"type":"match","prompt":"Match the firm to what it is","pairs":[["Jane Street","Prop trading firm and market maker"],["Millennium","Multi-strategy hedge fund built from pods"],["Goldman Sachs","Sell-side bank serving clients"],["Man Group","London-listed investment manager with big quant arm"],["Citadel Securities","Market maker, separate from Citadel the fund"]],"explain":"Own money and quoting prices: market maker. Outside money split into pods: multi-strategy. Serving clients: bank. Know which one you\'re talking to before you walk in."},{"type":"tf","statement":"HFT is a separate type of company, different from market makers.","answer":false,"explain":"High-frequency trading is a style: very fast, tiny profit per trade, huge numbers of trades. Many market makers are partly HFT."},{"type":"mcq","prompt":"What is a pod shop?","options":["A hedge fund split into many independent teams with strict loss limits","A market maker that only trades ETFs","A bank team that builds pricing models","Any firm doing high-frequency trading"],"answer":0,"explain":"Each pod has its own portfolio manager, strategy and loss limits. Lose too much and the pod gets shut. Citadel and Millennium are the famous examples."},{"type":"fill","sentence":"Prop shops trade their ___ money, not money from outside investors.","options":["own","clients\'","the bank\'s","pension funds\'"],"answer":"own","explain":"Proprietary means their own. No clients, no management fees: profit comes purely from trading well."}]},{"concept":{"term":"QT vs QR vs QD","definition":"Quant trader: real-time decisions on prices and risk. Quant researcher: finds and tests predictive signals in data. Quant developer: builds fast, reliable trading and research systems. Typical process: online assessment, mental maths, probability rounds, market games, superday.","analogy":"Football club. The trader is the striker deciding in a split second. The researcher is the scout with the spreadsheet. The developer is the groundsman: nobody claps, but nobody plays without him.","firm":{"name":"Optiver","text":"Market makers like Optiver are widely reported to test timed mental arithmetic early, so drill Zetamac. Later rounds usually bring probability questions, market-making games and a final day of interviews."},"interview":"\'Why QR not QT?\' Use evidence: your Monte Carlo and Markov chain work is research-shaped. Loving split-second calls under pressure is trader-shaped. Pick one and justify it.","trap":"Using the same answer for every role. Interviewers can tell when you don\'t know what the job actually is.","quip":{"who":"EMMA","text":"A superday is a stag do: eight hours, stone sober, and everyone\'s judging your arithmetic."}},"exercises":[{"type":"order","prompt":"Put a typical quant trading interview process in order","items":["Application and CV screen","Timed online maths and numeracy tests","Phone or video rounds on probability","Superday, often with market-making games"],"explain":"It varies by firm and year, and some merge steps, but this is the usual shape: screen cheaply first, save the expensive day of back-to-back interviews, market games included, for last."},{"type":"match","prompt":"Match the term to its meaning","pairs":[["Quant trader","Real-time decisions on prices and risk"],["Quant researcher","Finds and tests predictive signals in data"],["Quant developer","Builds fast, reliable trading systems"],["Zetamac","Free timed mental arithmetic practice site"],["Superday","Several interviews back to back"]],"explain":"Trader decides, researcher finds patterns, developer builds the machine. Zetamac is free and two minutes a go: do it on the train."},{"type":"interview","question":"Why do you want to be a quant researcher rather than a trader?","options":[{"text":"Researchers get paid loads and the hours sound better than trading.","verdict":"weak","why":"All about you, nothing about the work. Instant red flag."},{"text":"I like maths and data, and research sounds more interesting than trading.","verdict":"okay","why":"Honest but generic. No evidence you know what research involves."},{"text":"On placement I build Monte Carlo and Markov chain models from vehicle telematics and test whether they hold up. I enjoy that slow, rigorous loop more than split-second calls.","verdict":"strong","why":"Real evidence, shows what QR involves, and contrasts it with QT."}],"answer":2,"explain":"Strong answers show you know what the job is and point at real things you\'ve done. Never invent numbers; just say what you built and why it\'s relevant."},{"type":"number","prompt":"Zetamac warm-up, no calculator: 47 × 6 = ?","answer":282,"tolerance":0,"explain":"Split it: 40 × 6 = 240, 7 × 6 = 42, total 282. Breaking numbers into easy chunks is the whole trick to timed mental maths."}]}],"finale":[{"type":"market","title":"Three Dice Under a Cup","intro":"Make a market on the sum of three fair dice. Quote a bid and an offer around fair value, with a width that matches your uncertainty.","steps":[{"reveal":"No information. Three dice are rolled under a cup.","fair":10.5,"sd":3,"explain":"3 × 3.5 = 10.5. One die has variance 35/12 ≈ 2.92 (sd ≈ 1.71). Three dice: 8.75, sd ≈ 2.96, about 3. Something like 9 at 12 is sensible."},{"reveal":"One die, picked at random, is revealed. It\'s a six.","fair":13,"sd":2.4,"explain":"6 + 2 × 3.5 = 13. Two unknown dice: variance 5.83, sd ≈ 2.4. If you sold at 12 last round, you\'re now short and losing about 1. Say so out loud, then quote around 13, like 12 at 14."},{"reveal":"A second die is revealed. It\'s a two.","fair":11.5,"sd":1.7,"explain":"6 + 2 + 3.5 = 11.5. Only one die left, sd ≈ 1.71, so tighten up: something like 10.5 at 12.5. Less uncertainty, tighter market."}]},{"type":"number","prompt":"Buy 20 at 30. Sell 15 at 33. The market is now 28. Total P and L?","answer":35,"tolerance":0,"explain":"Fifteen sold: 15 × (33 − 30) = +45. Five still held, marked at 28: 5 × (28 − 30) = −10. Total +35, and you\'re long 5."},{"type":"interview","question":"You\'re quoting 99 bid, 100 offer. You get lifted five times in a row, on big size. What do you do?","options":[{"text":"Keep quoting 99 at 100. I earn a penny every time, so more fills means more money.","verdict":"weak","why":"Ignores your growing short and the information in the flow."},{"text":"I\'m now short a lot, and repeated big buying looks informed, so fair is probably higher. I\'d move both prices up, maybe widen, check news and related products, and hedge if near my limit.","verdict":"strong","why":"States position, reads the information, updates prices, manages risk."},{"text":"Widen my spread a lot so they stop trading with me until things calm down.","verdict":"okay","why":"Sensible caution, but ignores your position and which way to move."}],"answer":1,"explain":"Say the position, say the information, move the prices, manage the risk, all out loud. The interviewer cares less about your exact numbers than seeing you update."}],"teaser":"Tomorrow, Day 5 swaps the trading floor for code: data structures. Arrays, hash maps, and why George\'s lookups are always O(n).","flashcards":[{"front":"What is a market maker?","back":"A firm that constantly quotes a bid and an offer, earning the spread over huge volume, often plus exchange rebates, while managing inventory risk and informed traders.<br>Like CeX: buy your Xbox at 80, sell it at 120."},{"front":"What is adverse selection?","back":"The people who choose to trade with you are more likely to know something you don\'t, so each fill is information and usually bad news for your quote.<br>Like a stranger selling you a drink ticket after the bar\'s shut."},{"front":"What is an exchange rebate?","back":"A payment (or fee discount) many exchanges give to traders whose resting orders add liquidity, often market makers who commit to quoting.<br>Like a pub paying the band to keep playing so the place stays busy."},{"front":"What is inventory risk?","back":"The risk that the price moves against the position a market maker is stuck holding before it can offload it.<br>Like buying a crate of beer for the party, then the party gets cancelled."},{"front":"Long, short, flat?","back":"<b>Long</b>: profit if the price rises. <b>Short</b>: profit if it falls. <b>Flat</b>: no position.<br>Long Spurs = betting they do well. Short Spurs = betting they bottle it."},{"front":"What is mark to market?","back":"Valuing your positions at today\'s market price, not the price you paid. An unrealised loss is still a loss.<br>Like stepping on the scales every morning: no pretending you\'re still your August weight."},{"front":"What is edge?","back":"Your expected profit per trade: the gap between your trade price and fair value. Selling the three-dice sum at 12 when fair is 10.5 is 1.5 of edge.<br>Be the casino, not the stag do."},{"front":"What is alpha?","back":"Return beyond what you\'d get just from riding the market up and down. It\'s meant to be skill.<br>Beta is the escalator; alpha is how fast you walk up it."},{"front":"What is the Sharpe ratio?","back":"(Average return − risk-free rate) / volatility of returns. Return per unit of risk; higher is better.<br>12% return, 2% risk-free, 20% vol: Sharpe 0.5."},{"front":"Buy side vs sell side?","back":"<b>Sell side</b>: banks making markets and selling services to clients. <b>Buy side</b>: investors with money to put to work, like pension funds, asset managers and hedge funds.<br>Waiter vs diner."},{"front":"Prop shop vs hedge fund vs pod shop?","back":"<b>Prop shop</b>: trades only its own money; the famous ones are market makers. <b>Hedge/quant fund</b>: manages money for investors, often predicting prices. <b>Pod shop</b>: hedge fund split into independent teams with strict loss limits."},{"front":"QT vs QR vs QD?","back":"<b>Trader</b>: real-time decisions on prices and risk. <b>Researcher</b>: finds and tests predictive signals in data. <b>Developer</b>: builds fast, reliable trading and research systems.<br>Striker, scout, groundsman."},{"front":"Make a market on the sum of three dice.","back":"Fair is 3 × 3.5 = 10.5. Sd is about 3 (one die ≈ 1.71, so √3 × 1.71 ≈ 2.96). Quote something like 9 at 12.<br>Trap: 3 at 18 is a market nobody will ever trade on."},{"front":"Three dice, one is revealed as a six. New fair value?","back":"6 + 2 × 3.5 = 13, sd ≈ 2.4 from the two unknown dice. Move up and tighten, e.g. 12 at 14. If you\'d sold at 12, say you\'re short and losing."},{"front":"You\'re quoting 99 at 100 and get lifted five times on big size. What do you do?","back":"Say it: I\'m short a lot and the buying looks informed, so fair is probably higher. Move both prices up, maybe widen, check news and related products, hedge if near my limit.<br>Trap: \'keep quoting, free pennies\'."},{"front":"Buy 10 at 50, sell 4 at 52, market now 49. Position and P and L?","back":"Long 6. Realised: 4 × 2 = +8. Unrealised: 6 × (49 − 50) = −6. Total <b>+2</b>.<br>Trap: saying +8 and forgetting the six you still hold."},{"front":"Buy 20 at 30, sell 15 at 33, market now 28. Position and P and L?","back":"Long 5. Realised: 15 × 3 = +45. Unrealised: 5 × (28 − 30) = −10. Total <b>+35</b>."},{"front":"Why do market makers widen spreads before big news?","back":"Bigger expected moves raise inventory risk, and informed traders are more likely, raising adverse selection. A wider spread pays for that risk; quoting smaller size limits damage.<br>Trap: \'because it\'s riskier\' full stop. Break risk into pieces."},{"front":"What\'s the difference between Citadel and Citadel Securities?","back":"Citadel is a multi-strategy hedge fund (a pod shop). Citadel Securities is a market maker. Separate companies, same founder.<br>Trap: mixing them up signals zero research."},{"front":"Is HFT a type of firm?","back":"No, it\'s a style: trading very fast with tiny profit per trade, many times a second. Many market makers are partly HFT, and some funds use fast strategies too."}]}');var ec={};ec=JSON.parse('{"id":"w1d5","week":1,"day":5,"track":"swe","title":"Data Structures That Pay","subtitle":"Arrays, hash maps, stacks, queues, interview process","intro":[{"who":"GEORGE","text":"Good news. My pub crawl script finished. Bad news, it was me who finished, under a table in the Saracen\'s Head."},{"who":"EMMA","text":"Today we stop writing code with the wrong growth rate. Pick the right data structure and half the interview is done."},{"who":"GEORGE","text":"So it\'s not about being clever, it\'s about picking the right box to shove stuff in?"},{"who":"EMMA","text":"Exactly. Arrays, hash maps, stacks, queues. Then two sum, brackets, and how to talk like someone they want to hire."}],"units":[{"concept":{"term":"Array vs linked list","definition":"An array stores elements side by side in one contiguous block, so element i sits at start + i × size: O(1) access. A linked list scatters nodes, each holding a value and a pointer to the next, so reaching index k costs O(k).","analogy":"Array: a terraced street, jump straight to house 47. Linked list: a pub crawl where each barman tells you the next pub. Want pub ten? Get pissed in the first nine.","firm":{"name":"Citadel Securities","text":"Low-latency trading firms like Citadel Securities care about cache behaviour. A contiguous array pulls neighbours into cache for free, so it often beats a linked list on the stopwatch even where the list wins on Big O."},"interview":"Asked as \'array or linked list, and why?\' Strong answers give costs both ways: O(1) index vs O(n) walk, O(n) middle insert vs O(1) once you hold the node, then mention cache locality.","trap":"Saying linked list insertion is O(1) full stop. Only once you already hold a pointer to the spot. Finding it is O(n).","quip":{"who":"GEORGE","text":"Inserting into the middle of an array is like farting in a lift. Everyone has to shuffle along."}},"exercises":[{"type":"mcq","prompt":"Why is reading array[i] O(1)?","options":["Address is start + i × element size, one sum","The computer searches from the front very quickly","Arrays are always kept sorted","Each element stores a pointer to element i"],"answer":0,"explain":"Contiguous and evenly spaced means one bit of arithmetic finds any slot. No walking, no searching. Cloakroom ticket, straight to the hook."},{"type":"tf","statement":"Inserting a value at position 5,000 of a linked list is O(1).","answer":false,"explain":"The pointer swap is O(1), but you must walk 5,000 nodes to get there first. Total O(n). Only inserting at the head, or where you already hold the node, is constant."},{"type":"number","prompt":"An array starts at memory address 1000. Each element is 8 bytes. What is the address of index 5?","answer":1040,"tolerance":0,"explain":"1000 + 5 × 8 = 1040. Index 0 sits at 1000, so index 5 is five strides along. That one sum is why array indexing is O(1)."},{"type":"fill","sentence":"Arrays scan fast because neighbouring elements arrive together in one ___ line.","options":["cache","pointer","hash","call"],"answer":"cache","explain":"The CPU fetches memory in chunks, typically 64 bytes. Read one array element and its neighbours come free. Linked list nodes are scattered, so each hop can be a cache miss."}]},{"concept":{"term":"Hash map and hash set","definition":"A hash map stores key-value pairs in an array of buckets. A hash function turns the key into a number, modulo the bucket count picks the bucket. Lookups and inserts are O(1) on average, O(n) worst case. A hash set stores keys only.","analogy":"Gym lockers. Give your name, the receptionist applies a rule and goes straight to your locker. Two names, same locker? Collision. Now you\'re sharing with a bloke whose socks could strip paint.","firm":{"name":"Google","text":"Hash maps crack a huge share of big tech coding questions at firms like Google: counting frequencies, grouping anagrams, two sum. Interviewers expect you to reach for one and state average and worst case unprompted."},"interview":"If you catch yourself scanning a list to ask \'have I seen this?\', say \'a hash set makes that O(1) on average\'. Then add the worst case and why: collisions.","trap":"Saying \'hash maps are O(1)\' with no caveat. It\'s average O(1); everything colliding into one bucket makes it O(n).","quip":{"who":"EMMA","text":"A bad hash function is a nightclub with one toilet cubicle. Technically works. Queue is linear and grim."}},"exercises":[{"type":"match","prompt":"Match the term to its meaning","pairs":[["Hash function","Turns a key into a number, same key, same number"],["Bucket","One slot in the underlying array"],["Collision","Two different keys land in the same bucket"],["Load factor","Entries divided by number of buckets"],["Rehashing","Moving every key into a bigger table"]],"explain":"The whole hash map in five words. Function picks the bucket, collisions share it, load factor tells you when to rehash into a bigger table."},{"type":"number","prompt":"A hash table has 16 buckets and holds 12 entries. What is its load factor?","answer":0.75,"tolerance":0.001,"explain":"12 / 16 = 0.75. That\'s Java HashMap\'s default resize threshold. Python\'s dict resizes at about two thirds full. Past that, collisions pile up, so the table grows and rehashes."},{"type":"mcq","prompt":"Every key in a hash map collides into one bucket (simple chaining). Lookup cost?","options":["O(1), hashing is always constant","O(log n), it\'s basically a tree","O(n), it\'s basically one long list","O(n²), every key compares with every key"],"answer":2,"explain":"One bucket holding everything is a list you scan. Bonus depth: since Java 8, HashMap turns very crowded buckets into balanced trees, capping that bucket near O(log n)."},{"type":"tf","statement":"In Python you can use a list as a dictionary key.","answer":false,"explain":"Lists are mutable, so they\'re unhashable. If a key changed after storing it, its hash would change and you\'d never find it again. Use a tuple instead."}]},{"concept":{"term":"Stack","definition":"A last in, first out (LIFO) collection. Push onto the top, pop off the top, both O(1). Used for the call stack, undo, the browser back button and bracket matching. In Python a list works well as a stack.","analogy":"A stack of pint glasses behind the bar. You take from the top. Pull one from the bottom and you\'re off to A&E with glass in your arse.","firm":{"name":"Bloomberg","text":"Bloomberg\'s software interviews are known for classic data structure questions. Stack problems like bracket matching or a \'min stack\' that returns the minimum in O(1) are standard. State the push and pop costs without being asked."},"interview":"Spot the LIFO signal: \'most recent unmatched thing\', nested structure, undo, reversing. Say \'that\'s a stack\' and explain why the latest item must be handled first.","trap":"Calling recursion \'constant space\'. Every call adds a frame to the call stack, so recursion n deep uses O(n) space.","quip":{"who":"GEORGE","text":"Stack overflow: when your recursion has no base case, like my Friday night."}},"exercises":[{"type":"fill","sentence":"A stack adds and removes items at the ___ only.","options":["top","bottom","both ends","middle"],"answer":"top","explain":"Push and pop both happen at the top, which is why both are O(1). Both ends is a deque. One in, one out the other end is a queue."},{"type":"order","prompt":"main() calls load(), which calls parse(). Put the call stack events in order.","items":["Push frame for main","Push frame for load","Push frame for parse","parse returns, its frame pops","load returns, back in main"],"explain":"Each call pushes a frame with its local variables and return address. The deepest call finishes first. Last in, first out, exactly like the pint glasses."},{"type":"tf","statement":"Python\'s default recursion limit is about 1,000 calls, after which it raises RecursionError.","answer":true,"explain":"CPython defaults to 1,000 (sys.getrecursionlimit). It\'s a guard against a real stack overflow crashing the interpreter. Deep recursion in an interview? Mention converting it to a loop with an explicit stack."},{"type":"mcq","prompt":"Which of these is NOT a natural stack use?","options":["Undo button","Browser back button","Bracket matching","Printer job queue"],"answer":3,"explain":"Printer jobs go first come, first served: that\'s a queue. The other three all need the most recent item first, which is pure LIFO."}]},{"concept":{"term":"Queue and deque","definition":"A queue is first in, first out (FIFO): add at the back, remove from the front. A deque (said \'deck\', double-ended queue) adds and removes at both ends in O(1). Queues power job queues and breadth-first search.","analogy":"Your gut is a queue. First in, first out. If it were a stack, last night\'s kebab would come out before Tuesday\'s porridge, and that\'s a hospital visit.","firm":{"name":"Amazon","text":"Amazon\'s systems lean on queues to pass work between services; AWS even sells one, SQS. In coding rounds, breadth-first search with a queue, say shortest path on a grid, is a classic."},"interview":"Asked as \'how would you implement a queue in Python?\' Strong answer: collections.deque, append to add, popleft to remove, both O(1). Then say why not a plain list.","trap":"Using a Python list as a queue with pop(0). Every remaining element shuffles down one place, so each removal is O(n).","quip":{"who":"EMMA","text":"pop(0) on a big list: a Tesco queue where everyone shuffles forward one tile. Use a deque."}},"exercises":[{"type":"number","prompt":"A Python list holds 10,000 items. You call pop(0). How many remaining items shift one place left?","answer":9999,"tolerance":0,"explain":"One item leaves the front, the other 9,999 all move down a slot. That\'s O(n) per pop, so draining the whole list this way is O(n²). deque.popleft() is O(1)."},{"type":"mcq","prompt":"Breadth-first search explores a graph level by level. Which structure drives it?","options":["A queue","A stack","A hash map","A sorted array"],"answer":0,"explain":"FIFO means nodes found first get explored first, so you finish each level before the next. Swap in a stack and you get depth-first search instead."},{"type":"tf","statement":"Python\'s deque gives O(1) access to an element in the middle, just like a list.","answer":false,"explain":"deque is O(1) at both ends but indexing slows to O(n) in the middle. It\'s built from linked blocks, not one contiguous array. Pick it for ends, a list for random access."},{"type":"fill","sentence":"To remove from the front of a collections.deque in O(1), call ___.","options":["popleft()","pop()","pop(0)","remove()"],"answer":"popleft()","explain":"popleft() takes from the front, pop() from the back. deque doesn\'t even accept pop(0), and on a list pop(0) is the O(n) trap. remove() searches by value: O(n)."}]},{"concept":{"term":"Two sum and valid brackets","definition":"Two sum: find two numbers adding to a target. Brute force checks every pair, O(n²). One pass with a hash map of seen values, asking \'have I seen target minus this?\', is O(n) time and O(n) space. Valid parentheses: push openers, pop on matching closers.","analogy":"Two sum brute force is speed dating where everyone dates everyone. The hash map version is a host with a clipboard: \'your match is already here, table four\'.","firm":{"name":"Goldman Sachs","text":"Goldman Sachs is widely reported to use HackerRank online assessments. Hidden tests often include large inputs, so an O(n²) solution can pass the small cases and time out on the big ones."},"interview":"For two sum: name the brute force and its cost, spot the repeated scan for the partner, kill it with a hash map. For brackets: say \'most recent unclosed opener closes first, so a stack\'.","trap":"Two sum: inserting before checking, so 3 pairs with itself for target 6. Brackets: forgetting the stack must be empty at the end.","quip":{"who":"GEORGE","text":"Leftover openers on the stack at the end? Like leaving the pub with the tab still open."}},"exercises":[{"type":"number","prompt":"Brute force two sum checks every pair once. How many pairs for 1,000 numbers?","answer":499500,"tolerance":0,"unit":"pairs","explain":"n(n − 1)/2 = 1,000 × 999 / 2 = 499,500. Roughly n²/2, which is still O(n²). The hash map version does about 1,000 lookups."},{"type":"interview","question":"You\'ve said two sum brute force is O(n²). How would you make it faster?","options":[{"text":"For each number, its partner is target minus it. I scan for that partner every time, so I\'d store seen numbers and indices in a hash map: one pass, O(n) time, O(n) space.","verdict":"strong","why":"Names the repeated work, picks the structure, states time and space."},{"text":"Sort the array and use two pointers from each end. O(n log n).","verdict":"okay","why":"Valid idea, but sorting loses original indices unless you track them. Say so."},{"text":"Use a hash map, it makes everything O(1).","verdict":"weak","why":"Right tool, no reasoning, and \'everything O(1)\' is wrong."}],"answer":0,"explain":"Interviewers want the why: what you\'re repeating and how the structure kills it. Mentioning the sort and two-pointer alternative afterwards shows range."},{"type":"order","prompt":"Trace the stack check for the string ([]). Put the steps in order.","items":["Push (","Push [","See ], top is [, pop","See ), top is (, pop","End: stack empty, so valid"],"explain":"The most recent unclosed opener must close first: LIFO. Every closer must match the top, and the final empty check catches leftover openers like in ((."},{"type":"mcq","prompt":"In one-pass two sum, why check the map BEFORE inserting the current number?","options":["So a number can\'t pair with itself","Because inserting first is O(n)","To keep the map sorted","So duplicates overwrite older indices"],"answer":0,"explain":"Target 6 with a single 3: insert first and 3 finds itself. Check first and you only match earlier numbers, so [3, 3] works and a lone 3 doesn\'t."}]},{"concept":{"term":"The interview process","definition":"The pattern interviewers want, out loud: clarify the problem, give the brute force with its complexity, find the repeated work and optimise, code cleanly while narrating, test edge cases, then state final time and space complexity.","analogy":"Like a decent poo: assess the situation, commit, finish properly, check before you leave. Skipping the final check is how you get caught out.","firm":{"name":"Meta","text":"Coding rounds at big tech firms like Meta, Google and Amazon judge communication as well as code. Trading firms add a premium on clean, correct code over clever tricks. A silent genius loses to a clear narrator."},"interview":"Strong candidates ask about duplicates, negatives and empty input before coding, say the brute force cost early, and finish with an unprompted test run plus final complexity.","trap":"Jumping straight into code, then going silent. The interviewer can\'t give you credit for thinking they can\'t hear.","quip":{"who":"GEORGE","text":"Stating the final complexity is leg day. Everyone skips it. Everyone can tell."}},"exercises":[{"type":"order","prompt":"Put the coding interview steps in order.","items":["Clarify inputs, constraints and edge cases","State brute force and its complexity","Spot repeated work and optimise","Code cleanly while narrating","Test edge cases, state final complexity"],"explain":"Clarify, brute force, optimise, code, test, complexity. Brute force first proves you can solve it at all; the final complexity is the bit everyone forgets."},{"type":"mcq","prompt":"An online test says n can be up to 100,000. What should that tell you?","options":["O(n²) will likely time out; aim for O(n) or O(n log n)","Any solution passes, computers are fast","You need O(1) time overall","Use recursion to save memory"],"answer":0,"explain":"100,000² is 10 billion steps: hidden tests will time out. Input limits quietly tell you the intended complexity. And O(1) total is impossible when you must read every element."},{"type":"interview","question":"You\'ve finished coding. The interviewer goes quiet. What do you do?","options":[{"text":"Say you\'re done and wait for feedback.","verdict":"weak","why":"Hands control back without proving the code works."},{"text":"Walk a small example through the code line by line, then try edge cases: empty input, one element, duplicates, negatives. Fix bugs found, then state final time and space complexity.","verdict":"strong","why":"Tests before being asked, catches your own bugs, finishes with complexity."},{"text":"Say the complexity is O(n) and ask if they want another problem.","verdict":"okay","why":"Complexity is good, but untested code is a risk."}],"answer":1,"explain":"Finding your own bug is worth points; the interviewer finding it costs you. Silence after coding is your cue to test out loud."},{"type":"tf","statement":"You only need to state your solution\'s complexity if the interviewer asks.","answer":false,"explain":"Say it unprompted every time, time and space, with the reason. It shows you think about scale. If you wait to be asked, you\'ve already lost the easy marks."}]}],"finale":[{"type":"match","prompt":"Match the scenario to the best data structure","pairs":[["Undo button","Stack: most recent action comes off first"],["Orders at one price","Queue: first come, first filled"],["Seen this user ID?","Hash set: average O(1) membership check"],["Count trades per ticker","Hash map: key to running count"],["Sliding window, both ends","Deque: O(1) add and drop at either end"]],"explain":"Undo is LIFO. Price-time priority means earlier orders at a price fill first: FIFO. Membership is a set, counting is a map, both-ends work is a deque."},{"type":"mcq","prompt":"An order book must find the best bid fast and keep price levels in order as they appear and vanish. Textbook structure for the levels?","options":["Sorted map or balanced tree keyed by price","Plain hash map keyed by price","Unsorted Python list of prices","A single stack of orders"],"answer":0,"explain":"A balanced tree keeps prices sorted with O(log n) insert and delete, and finds the best level fast. A plain hash map loses ordering. Real low-latency books often use tick-indexed arrays, but the tree is the standard answer."},{"type":"interview","question":"Design an LRU cache: get and put both O(1), evicting the least recently used item when full.","options":[{"text":"A list of keys in use order: move a key to the end on use and evict from the front.","verdict":"weak","why":"Finding and moving a key in a list is O(n)."},{"text":"Hash map from key to node in a doubly linked list ordered by use. On get or put, move the node to the front in O(1). When full, evict the tail and delete its key.","verdict":"strong","why":"Map gives O(1) lookup, list gives O(1) reorder and evict."},{"text":"In Python I\'d use OrderedDict with move_to_end and popitem(last=False).","verdict":"okay","why":"Correct and practical, but they usually want the structure underneath."}],"answer":1,"explain":"Two structures, each covering the other\'s weakness: the hash map finds the node, the doubly linked list reorders in O(1). Mention OrderedDict as the shortcut after showing you can build it."}],"teaser":"Tomorrow: data science. Why do averages of messy, lopsided data start looking normal? Sampling and the Central Limit Theorem.","flashcards":[{"front":"What is an array?","back":"Elements stored side by side in one contiguous block. Index access is O(1) via start + i × size; inserting in the middle is O(n) because everything shifts.<br>Like a terraced street: jump straight to house 47."},{"front":"What is a linked list?","back":"Nodes scattered in memory, each holding a value and a pointer to the next. Reaching index k is O(k); insert or delete is O(1) once you hold the node.<br>Like a pub crawl where each barman names the next pub."},{"front":"What is cache friendliness?","back":"The CPU loads memory in chunks (cache lines, typically 64 bytes). Contiguous arrays get neighbours for free; linked list hops can each miss the cache.<br>Shopping in aisle order vs a different Tesco per item."},{"front":"What is a hash map?","back":"Key-value store: a hash function maps the key to a bucket in an array. Lookup and insert are O(1) on average, O(n) worst case if keys collide.<br>Gym lockers: apply the rule, go straight to your locker."},{"front":"What is a hash collision, and how is it handled?","back":"Two keys land in the same bucket. <b>Chaining</b>: the bucket holds a list (Java HashMap). <b>Open addressing</b>: probe for another free bucket (Python dict).<br>Two dates turn up at the same table."},{"front":"What is the load factor?","back":"Entries ÷ buckets. When it passes a threshold (0.75 default in Java HashMap, about 2/3 for Python dict), the table grows and rehashes every key. Resizing is rare, so insert stays amortised O(1)."},{"front":"What is a stack?","back":"Last in, first out. Push and pop at the top, both O(1). Uses: call stack, undo, back button, bracket matching.<br>A stack of pint glasses: take from the top."},{"front":"What is a stack overflow?","back":"The call stack runs out of room, usually from recursion with no base case or too much depth. Python guards with a default limit of about 1,000 calls and raises RecursionError."},{"front":"What is a queue?","back":"First in, first out. Add at the back, remove from the front. Uses: job queues, print queues, breadth-first search.<br>Your gut: first in, first out."},{"front":"What is a deque?","back":"Double-ended queue, said \'deck\'. O(1) add and remove at both ends; Python\'s collections.deque. Middle indexing is O(n).<br>A queue you can jump into or leave from either end."},{"front":"How would you implement a queue in Python?","back":"collections.deque: append to add, popleft to remove, both O(1).<br>Trap: list.pop(0) is O(n) because every element shifts down."},{"front":"Are hash map lookups O(1)?","back":"O(1) on average, given a good hash function and resizing to keep the load factor low. Worst case O(n) if everything collides. Bonus: Java 8+ turns crowded buckets into trees, about O(log n)."},{"front":"Linked list or array: which is faster for inserts?","back":"Linked list insert is O(1) only once you hold the node; finding the spot is O(n). Arrays shift O(n) items but have great cache locality, so default to a dynamic array unless you already hold pointers."},{"front":"Solve two sum efficiently.","back":"Brute force checks every pair: O(n²). Better: one pass with a hash map of value → index. For each x, check if target − x is in the map, then insert x. O(n) time, O(n) space.<br>Trap: insert before checking and x pairs with itself."},{"front":"How do you check if brackets are valid, e.g. ([]){}?","back":"Stack. Push openers. On a closer, the top must be the matching opener, else invalid; pop it. At the end, valid only if the stack is empty. O(n) time, O(n) space.<br>Trap: forgetting the final empty check."},{"front":"Walk me through how you approach a coding problem.","back":"Clarify inputs and edge cases. State the brute force and its complexity. Spot repeated work and optimise with the right structure. Code while narrating. Test edge cases. State final time and space complexity out loud."},{"front":"Design an LRU cache with O(1) get and put.","back":"Hash map from key to node in a doubly linked list ordered by recent use. On access, move the node to the front; when full, evict the tail and delete its key from the map. Python shortcut: OrderedDict."},{"front":"Which structure for an undo button? For orders at one price level?","back":"Undo: a stack, the most recent action comes off first. Orders at one price: a queue, because price-time priority fills earlier orders first."},{"front":"The test says n ≤ 100,000. What does that tell you?","back":"O(n²) is about 10 billion steps and will likely time out. Aim for O(n) or O(n log n): think hash map, sorting, or two pointers."},{"front":"Why can\'t a Python list be a dict key?","back":"Lists are mutable, so unhashable. If a key changed after insertion its hash would change and it could never be found. Use a tuple instead."}]}');var ed={};ed=JSON.parse('{"id":"w1d6","week":1,"day":6,"track":"ds","title":"Samples, Lies and CLT","subtitle":"Bias, Bessel, the bell curve and fake links","intro":[{"who":"GEORGE","text":"Emma, nine out of ten lads at my gym are absolutely shredded. I asked everyone in the changing room. Science."},{"who":"EMMA","text":"You asked the ones still going in March, you muppet. The January quitters are at home, horizontal, inhaling sausage rolls."},{"who":"GEORGE","text":"So my stat is a lie?"},{"who":"EMMA","text":"Your stat is a liar with great abs. Today: samples, bias, n minus one, the CLT, and correlation pretending to be causation."},{"who":"GEORGE","text":"Numbers that lie to my face. Finally, something as unreliable as my bowels after a Tuesday curry."}],"units":[{"concept":{"term":"Population vs sample","definition":"The population is everyone you care about; the sample is the bit you actually measured. A parameter is a fixed, usually unknown, number about the population. An estimator is a recipe that turns sample data into a guess at it.","analogy":"Tasting one spoon to judge the whole pot of soup. Fine, as long as you stirred first. Skim the top while the salt sits at the bottom and your spoon is a lying little sod.","firm":{"name":"Google","text":"An A/B test at Google is a sample: a slice of users sees the change. The parameter is the effect on every user. The measured lift is only an estimate, so the real question is how wrong it could be."},"interview":"Asked as \'parameter vs statistic?\' Strong answer: a parameter is fixed but unknown; a statistic is computed from the sample and changes every time you resample. Estimators are random variables.","trap":"Treating your sample number as the truth. Rerun the study and the sample mean moves. The population mean doesn\'t.","quip":{"who":"GEORGE","text":"So the parameter is what actually happened, and the estimate is what I tell my mum."}},"exercises":[{"type":"mcq","prompt":"An app has 5 million users. You survey 2,000. The true average screen time of all 5 million is a...","options":["Parameter","Statistic","Estimator","Sample"],"answer":0,"explain":"It\'s a fixed fact about the whole population, which you don\'t know. The average of the 2,000 users you survey is the statistic you use to estimate it."},{"type":"match","prompt":"Match the term to its meaning","pairs":[["Population","Everyone you care about"],["Sample","The subset you actually measured"],["Parameter","Fixed true value, usually unknown"],["Estimator","Recipe turning sample data into a guess"],["Estimate","The number the recipe spits out"]],"explain":"Parameter = truth. Estimator = recipe. Estimate = today\'s output of the recipe. Interviewers notice when you keep these straight."},{"type":"tf","statement":"If you repeat a survey with a fresh random sample, the population mean changes.","answer":false,"explain":"The population mean is fixed. Your sample mean is what jumps about from sample to sample. Measuring that wobble is exactly what standard error does, coming up in unit 5."}]},{"concept":{"term":"Selection and survivorship bias","definition":"Selection bias: your data isn\'t representative because of how things got into it. Sampling bias is the collection version, like surveying fitness outside a gym. Survivorship bias is a special case: you only see what survived a filter.","analogy":"Judging a night out only by the lads still standing at 3am. The ones face down in the taxi rank aren\'t in your sample, and they had the more informative evening.","firm":{"name":"G-Research","text":"Quant funds like G-Research live on backtests. Test a strategy only on stocks that exist today and you\'ve silently dropped every firm that went bust or got delisted. Returns look better than reality ever was."},"interview":"Classic: \'WW2 bombers return with holes in the wings, few in the engines. Where do you add armour?\' Strong answer: the engines. Planes hit there mostly never came back.","trap":"Calling survivorship bias a separate family. It\'s a type of selection bias. Saying so shows you know how the pieces fit.","quip":{"who":"EMMA","text":"Survivorship bias is why dropout billionaires give TED talks while ten thousand other dropouts give their mum grey hair."}},"exercises":[{"type":"mcq","prompt":"WW2 bombers return with holes mostly in wings and fuselage, few on engines. Abraham Wald said armour...","options":["The engines, where returning planes had few holes","The wings, where most of the holes were","Everywhere equally, since hits are random","Nowhere, the extra weight costs more than it saves"],"answer":0,"explain":"You only saw planes that survived. Engine hits rarely made it home, so the missing holes were the deadly ones. Armour where the survivors are clean."},{"type":"fill","sentence":"A backtest run only on stocks still listed today suffers from ___ bias.","options":["survivorship","confirmation","recall","measurement"],"answer":"survivorship","explain":"Bankrupt and delisted stocks have been quietly binned, so the universe is all winners. Proper backtests use point-in-time data that includes the dead ones."},{"type":"interview","question":"A hedge fund database says the average fund returned 10% a year over 20 years. Do you believe it?","options":[{"text":"Probably too high, the sample might be biased somehow. I\'d look at how the data was collected before trusting it.","verdict":"okay","why":"Right instinct, but vague: no mechanism, no direction."},{"text":"I\'d be sceptical. Funds that blow up or close usually stop reporting and drop out, so the database over-represents winners. That\'s survivorship bias, so the true average is likely lower. I\'d want dead funds included.","verdict":"strong","why":"Names the bias, the mechanism, the direction and the fix."},{"text":"Yes. Twenty years is a big sample, so the Law of Large Numbers makes the average reliable.","verdict":"weak","why":"More data doesn\'t remove bias. It just converges on the wrong answer."}],"answer":1,"explain":"Bias questions reward three things: what is missing, which way it pushes the number, and how you\'d fix the data."},{"type":"tf","statement":"Collecting a much bigger sample fixes selection bias.","answer":false,"explain":"A bigger biased sample gives you a more precise wrong answer. Sample size kills noise, not bias. You fix bias by fixing how data gets in."}]},{"concept":{"term":"Unbiased estimators and n − 1","definition":"An estimator is unbiased if, averaged over many repeated samples, it hits the true value. Sample variance divides by n − 1 (Bessel\'s correction) because dividing by n underestimates the true variance on average.","analogy":"Your mates choose where the table goes after sitting down, so it lands slap in their middle and everyone looks close to it. Measuring spread from your own sample mean flatters you the same way.","firm":{"name":"Two Sigma","text":"Quant fund interviews, at places like Two Sigma, can push further: \'Is the sample standard deviation unbiased?\' No. The n − 1 variance is, but taking the square root drags it slightly low."},"interview":"\'Why n − 1?\' Strong: deviations are measured from the sample mean, fitted to the same data, so they look too small. n − 1 corrects that. Bonus: one degree of freedom is used up.","trap":"Saying \'because it\'s unbiased\' with no reason, or claiming the sample standard deviation is unbiased too.","quip":{"who":"GEORGE","text":"Degrees of freedom: how many pints I pick before my girlfriend picks the rest for me."}},"exercises":[{"type":"fill","sentence":"Dividing by n tends to ___ the true variance, because points sit closer to their own mean.","options":["underestimate","overestimate","exactly match"],"answer":"underestimate","explain":"The sample mean is the point that minimises squared distance to your data, so it hugs the points closer than the true mean does. Spread looks too small; n − 1 inflates it back."},{"type":"number","prompt":"Sample: 2, 4, 6. Using Bessel\'s correction (divide by n − 1), what is the sample variance?","answer":4,"tolerance":0,"explain":"Mean is 4. Squared deviations: 4, 0, 4, total 8. Divide by n − 1 = 2 to get 4. Divide by n and you\'d get 2.67, too small on average."},{"type":"tf","statement":"Three numbers average 10. Two of them are 8 and 13. The third can still be anything.","answer":false,"explain":"The total must be 30, so the third is 30 − 21 = 9. Fixing the mean uses up one degree of freedom, leaving n − 1 free values. That\'s the other way to explain n − 1."},{"type":"interview","question":"A colleague estimated the variance of daily returns by dividing by n. Someone says that\'s biased. Who\'s right?","options":[{"text":"The critic, because n − 1 is the unbiased formula.","verdict":"okay","why":"Right answer, zero reasoning. Sounds memorised."},{"text":"Neither. Dividing by n is unbiased as long as returns are normally distributed.","verdict":"weak","why":"Wrong. Normality doesn\'t remove the bias."},{"text":"The critic. Deviations are measured from the sample mean, fitted to the same data, so spread looks too small; n − 1 fixes it. With thousands of days it\'s tiny though. Fat tails matter more.","verdict":"strong","why":"Fixes the maths, then shows judgement about what actually matters."}],"answer":2,"explain":"The move is: answer the question correctly, then say what really matters in practice. With n = 2,500 the n vs n − 1 gap is 0.04%. Fat tails can wreck you."}]},{"concept":{"term":"LLN vs CLT","definition":"Law of Large Numbers: as n grows, the sample mean settles on the true mean. Central Limit Theorem: the distribution of the sample mean, once centred and scaled, approaches a normal bell curve, whatever the data\'s shape (independent draws, finite variance).","analogy":"LLN: the average of a pub crawl lands on the truth. CLT: rerun the crawl a thousand times and the averages pile up in a bell. The individual drinkers stay as messy as ever.","firm":{"name":"Meta","text":"A/B tests at Meta compare averages like time spent, which are wildly skewed per user. The CLT is why the difference in means is roughly normal anyway, so standard tests and confidence intervals work."},"interview":"\'Difference between LLN and CLT?\' Strong: LLN is where the average goes, CLT is the bell shape of its spread around the truth. Then add: the raw data does not become normal.","trap":"Saying the CLT makes the data normal. Collect a million salaries and they\'re still skewed. Only the average goes bell-shaped.","quip":{"who":"EMMA","text":"The LLN doesn\'t mean roulette owes you black after five reds. The wheel has no memory and no conscience."}},"exercises":[{"type":"match","prompt":"Match the term to its meaning","pairs":[["LLN","Sample mean settles on the true mean"],["CLT","Sample mean\'s distribution becomes bell-shaped"],["Gambler\'s fallacy","Believing luck must even out soon"],["i.i.d.","Independent draws, same distribution"],["Finite variance","A condition the classic CLT needs"]],"explain":"LLN = where. CLT = what shape. The gambler\'s fallacy is the LLN misread: early luck gets swamped by new data, not corrected."},{"type":"mcq","prompt":"You collect 1 million app session lengths (heavily right-skewed). The histogram of the sessions will be...","options":["Still right-skewed","Approximately normal, thanks to the CLT","Roughly uniform","Symmetric but fat-tailed"],"answer":0,"explain":"More data shows the true shape more clearly. It doesn\'t change it. The CLT is about the distribution of the average, not the raw data. The classic mix-up."},{"type":"tf","statement":"For large n, (sample mean − μ) / (σ / √n) is approximately standard normal.","answer":true,"explain":"That\'s the CLT stated properly: centre by μ, scale by σ/√n, and the result tends to N(0, 1). Needs independent, identically distributed draws with finite variance."},{"type":"order","prompt":"Put the steps of a CLT simulation in order","items":["Pick a skewed distribution, like exponential","Draw a random sample of size n","Compute that sample\'s mean","Repeat thousands of times","Histogram the means: a bell appears"],"explain":"This is Monte Carlo, Sam\'s day job. Each mean is one draw from the sampling distribution, and for decent n that distribution is close to normal."}]},{"concept":{"term":"Standard error and √n","definition":"The standard error is the standard deviation of an estimate: how much it would wobble if you reran the study. For a mean, SE = σ / √n. Because of the square root, halving the error needs four times the data.","analogy":"Like the gym. First month, gains everywhere. After that, four times the effort for half the progress. Your error bars, like your biceps, hit brutal diminishing returns.","firm":{"name":"Monzo","text":"Fintechs like Monzo run A/B tests on app changes. Sizing them is a √n game: a test too noisy at 10,000 users needs 40,000 to halve the error. Small effects need big tests."},"interview":"\'Our test is too noisy. How many more users?\' Strong: SE scales with 1/√n, so half the error means 4x the users. Then weigh cost, time and whether the effect is worth detecting.","trap":"Mixing up standard deviation (spread of the data) with standard error (spread of the estimate). More data shrinks SE, not SD.","quip":{"who":"GEORGE","text":"Four times the data for half the error? Worst exchange rate since that cash machine in Magaluf."}},"exercises":[{"type":"number","prompt":"Per-user spend has standard deviation £20. You sample 100 users. What is the standard error of the mean, in pounds?","answer":2,"tolerance":0,"unit":"pounds","explain":"SE = σ / √n = 20 / √100 = 20 / 10 = £2. Your sample average typically sits within a couple of quid of the truth."},{"type":"fill","sentence":"To cut the standard error to a third, you need ___ times as much data.","options":["3","6","9","27"],"answer":"9","explain":"SE ∝ 1/√n. To divide SE by 3, √n must triple, so n goes up 3² = 9 times. Errors shrink with the square root, costs grow with the square."},{"type":"mcq","prompt":"You double the sample size. The standard error...","options":["Falls by about 29%","Halves","Falls by about 41%","Stays the same"],"answer":0,"explain":"New SE = old SE / √2 ≈ 0.71 × old, a fall of about 29%. \'Halves\' forgets the square root. 41% is √2 − 1, the right number in the wrong place."},{"type":"tf","statement":"Collecting more data makes the standard deviation of your data shrink towards zero.","answer":false,"explain":"The SD estimates the population\'s spread, which is fixed, so it settles near σ. It\'s the standard error, σ/√n, that heads to zero."}]},{"concept":{"term":"Correlation vs causation","definition":"Covariance says whether two variables move together, but its size depends on units. Correlation rescales it to lie between −1 and 1. It only measures linear relationships, and it says nothing about what causes what.","analogy":"Ice cream sales and drownings rise together. Ice cream isn\'t killing anyone: hot weather drives both. A confounder is the mate who introduced two people who now can\'t stand each other.","firm":{"name":"JPMorgan","text":"Risk teams at banks like JPMorgan watch correlation closely: ten stocks that move together are one bet, not ten. Correlations tend to jump in a crisis, so diversification vanishes exactly when you need it."},"interview":"\'Users of feature X retain better. Push it to everyone?\' Strong: not yet. Keen users may both find X and stay anyway, a confounder. Run a randomised A/B test to get the causal effect.","trap":"Thinking zero correlation means independent. y = x² on a symmetric range has zero correlation, yet y is completely determined by x.","quip":{"who":"GEORGE","text":"Drinks versus quality of night: up, then down. Correlation near zero. Hangover a hundred."}},"exercises":[{"type":"mcq","prompt":"x is spread evenly from −1 to 1, and y = x². The correlation between x and y is...","options":["0","1","About 0.5","−1"],"answer":0,"explain":"y goes down then up, symmetrically. The left half\'s negative slope cancels the right half\'s positive slope, so the best straight line is flat. Perfect dependence, zero correlation."},{"type":"tf","statement":"Measuring height in centimetres instead of metres changes the correlation between height and weight.","answer":false,"explain":"The covariance gets 100 times bigger, but so does height\'s standard deviation, and correlation divides by it. Correlation is unit-free; that\'s the whole point of it."},{"type":"match","prompt":"Match the term to its meaning","pairs":[["Covariance","Co-movement in raw units, unbounded"],["Correlation","Scaled co-movement between −1 and 1"],["Confounder","Hidden variable driving both things"],["Spurious correlation","Fluke link from testing loads of series"],["Randomisation","Main tool to break confounding"]],"explain":"Randomise who gets the treatment and confounders get shared equally across groups, so any difference left is caused by the treatment, give or take noise."},{"type":"interview","question":"Users who use feature X retain much better. Should we push everyone to use it?","options":[{"text":"Yes. A correlation of 0.6 with retention is strong, so the feature clearly makes users stay.","verdict":"weak","why":"Treats correlation as causation. The exact trap they set."},{"text":"Not yet. Engaged users are more likely to find X and to stay anyway, a confounder. I\'d run an A/B test, randomly giving X to some users, and compare retention.","verdict":"strong","why":"Names the confounder, explains it, proposes the causal test."},{"text":"Maybe. Correlation isn\'t causation, so I\'d be careful before rolling it out.","verdict":"okay","why":"Correct slogan, no mechanism, no plan."}],"answer":1,"explain":"Big tech product interviews ask this constantly. The slogan gets you nothing; the confounder story plus a randomised experiment gets you the offer."}]}],"finale":[{"type":"interview","question":"Explain the Central Limit Theorem to a non-technical stakeholder.","options":[{"text":"The sum of i.i.d. random variables with finite variance, once centred and scaled, converges in distribution to a normal.","verdict":"okay","why":"Correct, but you\'ve recited a textbook to someone who asked for plain English."},{"text":"If you collect enough data, everything ends up looking like a bell curve, so we can always assume our data is normal.","verdict":"weak","why":"Wrong. The data stays skewed; only averages go bell-shaped."},{"text":"Everyone rolls a die ten times and averages. Single rolls are all over the place, but averages bunch near 3.5 in a bell shape. Averages are predictable even when individuals aren\'t. That\'s why polls work.","verdict":"strong","why":"Concrete, no jargon, gets the averages point right, links to something they know."}],"answer":2,"explain":"Asked at banks, big tech and quant firms to test understanding, not memory. Plain example first; save the conditions (independence, finite variance, big enough n) for a technical follow-up."},{"type":"number","prompt":"An A/B test with 2,500 users per arm gives a standard error of £2 on mean spend. Product wants £0.50. How many users per arm?","answer":40000,"tolerance":0,"unit":"users","explain":"£2 to £0.50 is a quarter of the error. SE ∝ 1/√n, so you need 4² = 16 times the users: 2,500 × 16 = 40,000. Precision is cheap to want, expensive to buy."},{"type":"mcq","prompt":"A quant tests 1,000 signals on today\'s S&P 500 members and one backtests brilliantly. Biggest worries?","options":["Survivorship bias and overfitting from testing so many signals","Bessel\'s correction wasn\'t applied to the returns","The CLT fails because daily returns are skewed","The sample is too large to be reliable"],"answer":0,"explain":"Today\'s members are survivors, so dead stocks are missing. And test 1,000 signals and some will shine by pure luck. Quant funds grill candidates on both."}],"teaser":"Tomorrow is the Boss Battle: everything from this week, mixed up, against the clock. No hints, no mercy, no toilet breaks.","flashcards":[{"front":"Population vs sample","back":"<b>Population</b>: everyone you care about. <b>Sample</b>: the subset you actually measured.<br>Analogy: one spoon of soup to judge the pot. Only works if you stirred first."},{"front":"Parameter vs estimator vs estimate","back":"<b>Parameter</b>: fixed true value about the population, usually unknown. <b>Estimator</b>: recipe turning sample data into a guess. <b>Estimate</b>: the number it outputs.<br>Analogy: truth vs what you tell your mum."},{"front":"What is selection bias?","back":"Data isn\'t representative because of how things got into it (e.g. optional surveys attract the very happy and the very angry). Sampling bias and survivorship bias are types of it.<br>Analogy: surveying fitness outside a gym."},{"front":"What is survivorship bias?","back":"Only analysing what survived a filter and ignoring what didn\'t. A type of selection bias.<br>Analogy: judging a night out by the lads still standing at 3am."},{"front":"What is an unbiased estimator?","back":"One whose average over many repeated samples equals the true value. Can still be noisy on any one sample.<br>Analogy: a darts player all over the board but centred on the bullseye."},{"front":"What is Bessel\'s correction?","back":"Dividing the sample variance by <b>n − 1</b> instead of n, so it is unbiased for the population variance.<br>Analogy: mates put the table in their own middle, so they look less spread out than they are."},{"front":"Law of Large Numbers","back":"As sample size grows, the sample mean converges to the true mean.<br>It works by swamping early luck with new data, not by \'evening out\'. The coin owes you nothing."},{"front":"Central Limit Theorem","back":"For independent draws with finite variance, the distribution of the sample mean, centred and scaled, approaches a normal as n grows, whatever the data\'s shape.<br>The raw data stays as weird as it was."},{"front":"What is the standard error?","back":"The standard deviation of an estimate: how much it would wobble if you reran the study. For a mean, SE = σ / √n.<br>Analogy: the gym. Four times the effort for half the progress."},{"front":"Covariance vs correlation","back":"<b>Covariance</b>: do two variables move together? Size depends on units. <b>Correlation</b>: covariance divided by both SDs, always between −1 and 1, unit-free. Both only capture linear relationships."},{"front":"What is a confounder?","back":"A hidden variable that drives both things you\'re looking at, creating a correlation without causation.<br>Example: hot weather drives both ice cream sales and drownings."},{"front":"WW2 bombers come back with holes in the wings, few in the engines. Where do you add armour?","back":"The engines. You\'re only seeing planes that survived; engine hits mostly didn\'t come home (Abraham Wald\'s point). Survivorship bias.<br>Trap: armouring where the holes are."},{"front":"What\'s wrong with backtesting only on stocks that are listed today?","back":"Survivorship bias. Bankrupt and delisted stocks are missing, so the backtest looks better than reality. Use point-in-time data including dead stocks.<br>Trap: thinking more years of data fixes it."},{"front":"Why does sample variance divide by n − 1?","back":"Deviations are measured from the sample mean, which is fitted to the same data, so they\'re too small on average. Dividing by n − 1 corrects that, making it unbiased. One degree of freedom is spent estimating the mean."},{"front":"Is the sample standard deviation unbiased?","back":"No. The n − 1 variance is unbiased, but the square root of an unbiased estimator isn\'t unbiased: the sample SD is slightly biased low.<br>Trap: saying yes because the variance is."},{"front":"What\'s the difference between the LLN and the CLT?","back":"LLN: where the sample mean ends up (the true mean). CLT: the shape of its spread around the truth (normal, for large n).<br>Trap: saying the CLT makes the data itself normal."},{"front":"Explain the CLT to a non-technical stakeholder.","back":"Everyone rolls a die ten times and averages. Single rolls are all over the place, but the averages bunch near 3.5 in a bell shape. Averages of many random things are predictable even when individuals aren\'t. That\'s why polls work."},{"front":"Our A/B test is too noisy. How many more users to halve the standard error?","back":"SE = σ/√n, so halving it needs <b>4x</b> the users (10,000 → 40,000). Then ask if the effect is worth the cost and time.<br>Trap: saying 2x."},{"front":"If two variables have zero correlation, are they independent?","back":"Not necessarily. Correlation only measures linear relationships. If x is symmetric around 0 and y = x², correlation is 0 but y is fully determined by x. Independence implies zero correlation, not the other way round."},{"front":"Users of feature X retain better. Should we push everyone to use it?","back":"Not yet. Engaged users may both find X and stay anyway: a confounder. Run an A/B test randomly giving X to some users to measure the causal effect.<br>Trap: \'yes, it\'s correlated\'."}]}');var eh={};eh=JSON.parse('{"id":"w1d7","week":1,"day":7,"track":"boss","title":"Boss Battle: Week 1","subtitle":"Six superday rooms. No notes, no mercy.","intro":[{"who":"GEORGE","text":"Superday. Six rooms, back to back. I\'ve packed a spare shirt, three Red Bulls and a nappy."},{"who":"EMMA","text":"Good, because these rooms mix everything. Order books, Big O, stats. They want application, not you reciting flashcards like a hostage video."},{"who":"GEORGE","text":"So if someone says \'you got lifted\', I don\'t flex my biceps?"},{"who":"EMMA","text":"You say \'I sold, I\'m short, I\'m updating\'. Then you flex. Room one, go."}],"units":[{"concept":{"term":"Room 1: Trading floor","definition":"1) Buyers lift offers, sellers hit bids. Got hit = you bought; got lifted = you sold. 2) Big orders eat through the book: price only holds for the size shown. 3) Mark to market: P and L counts open positions at today\'s price.","analogy":"The kebab shop at 2am: impatient punters pay whatever\'s on the board, and if you order 40 kebabs the price goes up halfway through.","firm":{"name":"Optiver","text":"Optiver is a market maker, and its process is widely reported to include fast mental maths and market-making games. Expect a trader to fire trades at you and ask your position and P and L without warning."},"interview":"They give you a sequence of trades and a current price. Strong answers state the position first, then realised P and L, then mark the open position to market, out loud.","trap":"Forgetting the shares you still hold. Plus eight on closed trades means nothing if your open six are underwater.","quip":{"who":"GEORGE","text":"Got hit means you bought. Like getting hit with a baby you never planned for."}},"exercises":[{"type":"number","prompt":"Offers: 300 at 100p, 500 at 101p, 1,000 at 102p. You send a market order to buy 1,000. Average price paid?","answer":100.9,"tolerance":0,"unit":"pence","explain":"300 x 100 + 500 x 101 + 200 x 102 = 100,900p over 1,000 shares = 100.9p. Saying \'100p\' means you forgot the best offer only holds for the size shown."},{"type":"mcq","prompt":"You\'re flat, quoting 49 at 51. You shout \'lifted on 20!\' What\'s your position?","options":["Short 20, sold at 51","Long 20, bought at 51","Long 20, bought at 49","Short 20, sold at 49"],"answer":0,"explain":"Lifted means someone bought your offer at 51, so you sold. Flat minus 20 = short 20. Lifted = it left you, like a wallet in Camden."},{"type":"number","prompt":"From flat: buy 20 at 50, then sell 30 at 53. Market is now 55. Total P and L?","answer":40,"tolerance":0,"explain":"20 bought at 50 and sold at 53: +60. You also sold 10 extra, so you\'re short 10 at 53, marked at 55: -20. Total +40, and you\'re short 10."},{"type":"tf","statement":"Spreads widen in a crisis mainly because exchanges put their fees up.","answer":false,"explain":"Spreads are mostly payment for risk. In a crisis inventory risk jumps, fewer makers compete, and more flow is informed. Fees are a rounding error next to that."}]},{"concept":{"term":"Room 2: Coding round","definition":"1) State time AND space, with the why. 2) Hash map: O(1) average, O(n) worst case. 3) List append is amortised O(1). 4) \'x in list\' is a hidden O(n) scan. Process: clarify, brute force, optimise, code, test.","analogy":"Meal prep: twenty tupperware boxes eat fridge space, but lunch takes ten seconds. A hash map is the same deal: spend memory, buy speed.","firm":{"name":"Bloomberg","text":"Bloomberg\'s software interviews are widely reported to be classic data structures and algorithms questions coded live. Finish the code and the next question is almost always: what\'s the time and space complexity?"},"interview":"Strong candidates say the brute force and its cost first, spot what\'s being repeated, then kill the repeat with a hash map or sort. Narrate every step.","trap":"Calling something O(n) when a loop hides \'in list\', a slice or a sort inside it. That\'s O(n squared) or worse in disguise.","quip":{"who":"EMMA","text":"Big O of N squared on a big input isn\'t slow. It\'s your laptop smelling of burnt toast till Tuesday."}},"exercises":[{"type":"mcq","prompt":"seen = []; for x in nums: if x in seen: return x; seen.append(x). Time complexity?","options":["O(n squared)","O(n)","O(n log n)","O(1) amortised"],"answer":0,"explain":"One loop of n, and \'x in seen\' scans a list each time. A loop around a hidden scan is O(n squared). Swap the list for a set and it\'s O(n)."},{"type":"fill","sentence":"Appending to a Python list is ___ O(1): one append can cost O(n) when it resizes.","options":["amortised","worst-case","always","never"],"answer":"amortised","explain":"Resizes grow capacity by a constant factor, so the copies get rarer. Total work for n appends is O(n), so each one averages O(1) across the sequence."},{"type":"order","prompt":"Order from slowest-growing (fastest code) to fastest-growing","items":["O(1): dict lookup on average","O(log n): binary search","O(n log n): comparison sort","O(n squared): brute-force two sum","O(2^n): every subset"],"explain":"Champions League down to hungover Sunday league. Log n barely grows, n log n is the price of sorting, n squared is nested loops, 2^n is every pizza topping combo."},{"type":"interview","question":"Given an array and a target, return indices of two numbers summing to the target. Talk me through it.","options":[{"text":"Clarify duplicates and negatives. Brute force checks every pair: O(n squared). Better: one pass, hash map of value to index; check if target minus x is in it. O(n) time, O(n) space.","verdict":"strong","why":"Clarifies, gives baseline, optimises, states both costs."},{"text":"Sort the array, then use two pointers from both ends. That\'s O(n log n) and I\'ll return those indices.","verdict":"okay","why":"Valid idea, but sorting scrambles the original indices unless you track them."},{"text":"Two nested loops over every pair. It\'s simple and it definitely works, so it\'s the best solution.","verdict":"weak","why":"Correct but O(n squared), and claims it\'s optimal without checking."}],"answer":0,"explain":"Interviewers want the journey: baseline, spot the repeated scan for a partner, kill it with a hash map. Say time and space without being asked."}]},{"concept":{"term":"Room 3: Stats round","definition":"1) Skewed data: median for typical, mean for totals. 2) Divide by n minus 1 because the sample mean hugs the data. 3) LLN = where the average lands; CLT = bell-shaped wobble. 4) SE = sd over root n.","analogy":"Bezos walks into the pub: the mean wealth goes stratospheric, the median is still a skint lad with a kebab-stained hoodie.","firm":{"name":"Meta","text":"Product data science interviews at big tech firms like Meta are widely reported to lean on A/B testing, metrics and stats intuition: mean or median, how much data you need, and whether a correlation is causal."},"interview":"Answer the decision, not the definition. \'It depends what we use it for\' plus one concrete reason beats any textbook recital. Then mention a check you\'d run.","trap":"Thinking the CLT makes the raw data normal. A million salaries are still skewed; only the average goes bell-shaped.","quip":{"who":"GEORGE","text":"Standard error shrinks with root n. Four times the data for half the wobble. Story of my gym progress."}},"exercises":[{"type":"number","prompt":"An A/B test on 2,500 users gives a standard error of 0.8. How many users to get it down to 0.2?","answer":40000,"tolerance":0,"unit":"users","explain":"SE scales with 1 over root n. Quartering the error needs 4 squared = 16 times the data: 2,500 x 16 = 40,000. Diminishing returns, like your bench press."},{"type":"mcq","prompt":"A 10-person startup: nine earn £30k, the founder pays himself £930k. Mean and median?","options":["Mean £120k, median £30k","Mean £30k, median £120k","Mean £93k, median £30k","Mean £120k, median £120k"],"answer":0,"explain":"Total is £270k + £930k = £1.2m over 10 people = £120k. The middle earners are on £30k. One outlier drags the mean; the median shrugs."},{"type":"tf","statement":"With enough data, the Central Limit Theorem makes daily stock returns normally distributed.","answer":false,"explain":"The CLT is about averages or sums, not the raw data. Daily returns stay fat-tailed however many you collect. Model them as normal and crashes look impossible."},{"type":"match","prompt":"Match the idea to what it really says","pairs":[["Law of Large Numbers","Sample average closes in on the true mean"],["Central Limit Theorem","Averages come out roughly bell-shaped"],["Standard error","How much your estimate wobbles between samples"],["Bessel\'s correction","Divide by n minus 1 to unbias variance"],["Confounder","Hidden cause driving both variables"]],"explain":"LLN is where, CLT is what shape, SE is how wobbly. Bessel fixes the sample mean hugging its own data. Hot weather is the classic confounder of ice cream and drownings."}]},{"concept":{"term":"Room 4: Jargon gauntlet","definition":"1) Adverse selection: the people keen to trade with you often know more. 2) Fat tails: extreme moves far more often than normal predicts. 3) Linked list insert is O(1) only once you\'re at the spot. 4) Survivorship bias is a type of selection bias.","analogy":"The jargon is a nightclub dress code: say \'ask\' instead of \'offer\' and you\'re fine, say \'I got lifted so I bought\' and the bouncer bins you.","firm":{"name":"Jane Street","text":"Jane Street is a market maker that trades its own money, not outside investors\'. Its interviews are widely described as probability and reasoning heavy, with real weight on thinking clearly out loud. Jargon slips get noticed."},"interview":"Nobody asks \'define a deque\'. They drop the word mid-question. A strong candidate uses it correctly in one breath and carries on solving.","trap":"Confidently using a term backwards. Wrong jargon delivered smoothly is worse than plain English.","quip":{"who":"EMMA","text":"Basis points are \'bips\'. George, if you say \'checked for bips at the clinic\' in there, I\'m leaving."}},"exercises":[{"type":"match","prompt":"Match the jargon to its meaning","pairs":[["Your bid got hit","Someone sold to you, so you bought"],["Adverse selection","Your fills come from better-informed traders"],["Deque","Add or remove at both ends in O(1)"],["Load factor","Entries divided by number of buckets"],["Fat tails","Extreme events more common than normal predicts"]],"explain":"Mixed bag on purpose: a superday flips from trading to code to stats inside one question. Hit = you bought. Deque = deck, not a French cheese."},{"type":"fill","sentence":"Only studying funds still running today ignores the dead ones: that\'s ___ bias.","options":["survivorship","confirmation","recall","anchoring"],"answer":"survivorship","explain":"The failures dropped out of the data, so returns look better than reality. Like the bombers: armour where the returning planes weren\'t hit. It\'s a special case of selection bias."},{"type":"tf","statement":"Inserting into a linked list at position 5,000 is O(1).","answer":false,"explain":"You must walk 5,000 nodes to get there: O(n). Insertion is only O(1) once you\'re already holding a pointer to the right spot, or at the head."},{"type":"mcq","prompt":"Which of these is a proprietary market maker, not a hedge fund?","options":["Optiver","Two Sigma","Man Group","Millennium"],"answer":0,"explain":"Optiver trades its own capital as a market maker. Two Sigma and Man Group are quant investment managers; Millennium is a multi-strategy pod shop. Different businesses, different answers to \'why us?\'"}]},{"concept":{"term":"Room 5: Interview technique","definition":"1) Structure: answer, reason, example, check. 2) \'Why this firm\' must show what the firm actually does. 3) Citadel (hedge fund) and Citadel Securities (market maker) are separate firms. 4) Think out loud; silence scores zero.","analogy":"A strong answer is a decent pint: clear, the right size, and a head on top. A weak one is flat, warm and mostly froth.","firm":{"name":"Citadel Securities","text":"Citadel Securities is a market maker, separate from Citadel, the multi-strategy hedge fund, though they share a founder. Mixing them up in a \'why us\' answer tells the interviewer you didn\'t do your homework."},"interview":"For \'why us\', name the business model, link it to something you\'ve genuinely done, and say what the role does day to day. Keep it under a minute.","trap":"\'I like maths and money.\' True of everyone in the building, so it says nothing.","quip":{"who":"GEORGE","text":"Confusing Citadel with Citadel Securities is like snogging the wrong twin. Technically similar. Still a disaster."}},"exercises":[{"type":"interview","question":"Why do you want to be a trader at Citadel Securities?","options":[{"text":"You\'re a market maker, so the job is pricing uncertainty and updating fast. At work I run Monte Carlo on vehicle data; I want that where feedback is instant and being wrong costs money.","verdict":"strong","why":"Right business model, real link to his work, no invented numbers."},{"text":"Citadel is one of the best hedge funds in the world and I\'d love to manage money at that level.","verdict":"weak","why":"Confuses the market maker with the hedge fund. Instant red flag."},{"text":"I love maths and fast-paced environments, and I\'ve heard the culture is really driven.","verdict":"okay","why":"Not wrong, but generic. Could be said about any firm."}],"answer":0,"explain":"A great \'why us\' proves you know what the firm does and why you fit that exact job. Specific beats enthusiastic every time."},{"type":"tf","statement":"If an interviewer asks for the CLT \'for a non-technical person\', the formal theorem is the strongest answer.","answer":false,"explain":"That tests whether you understand it. Use the dice-average story: individual rolls are chaos, everyone\'s average lands near 3.5 in a bell shape. Add conditions only if they push."},{"type":"interview","question":"Users of feature X retain 20% better. Should we push every user onto it?","options":[{"text":"Yes. The data clearly shows feature X drives retention, so we should roll it out to everyone now.","verdict":"weak","why":"Treats correlation as causation."},{"text":"Not yet. Keen users may find X and also stay anyway, a confounder. I\'d A/B test: randomly give X to some users an
