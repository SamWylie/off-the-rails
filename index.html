reak",icon:"🌱"},{id:"streak7",name:"Full Week",desc:"7-day streak (earns a freeze)",icon:"📅"},{id:"streak30",name:"Absolute Unit",desc:"30-day streak",icon:"🏋️"},{id:"tracks",name:"Triple Threat",desc:"A lesson in quant, software and data science",icon:"🎯"},{id:"boss",name:"Boss Slayer",desc:"Beat a Boss Battle",icon:"💀"},{id:"mm",name:"Market Maker",desc:"Nail every quote in a market game",icon:"📈"},{id:"sprint20",name:"Zetamac Warm",desc:"20+ in a 60s sprint",icon:"⚡"},{id:"sprint35",name:"Optiver Ready-ish",desc:"35+ in a 60s sprint",icon:"🧮"},{id:"anki5",name:"Card Shark",desc:"Download 5 Anki decks",icon:"🃏"},{id:"commuter",name:"Commuter",desc:"Finish a lesson before 9am",icon:"🚆"},{id:"owl",name:"Night Shift",desc:"Finish a lesson after 10pm",icon:"🦉"},{id:"comeback",name:"Comeback Kid",desc:"Start again after losing a streak",icon:"🪃"}];function eo(e,t){return!e.badges[t]&&(e.badges[t]=_(),!0)}var ei={};ei=JSON.parse('{"id":"w1d1","week":1,"day":1,"track":"quant","title":"Markets 101","subtitle":"Order books, spreads and getting hit","intro":[{"who":"GEORGE","text":"Emma, I stood in Tesco shouting that I\'d pay four quid for a chicken. Security walked me out."},{"who":"EMMA","text":"You posted a bid. Nobody sold, so you paid the bloke in the fleece £4.50. You crossed the spread."},{"who":"GEORGE","text":"So I\'m basically a trader now?"},{"who":"EMMA","text":"You\'re a trader banned from Tesco. Today: order books, spreads, and why getting hit means you bought."},{"who":"GEORGE","text":"Getting hit and ending up holding something I didn\'t want. That\'s every Saturday night I\'ve ever had."}],"units":[{"concept":{"term":"Exchange vs off-exchange","definition":"An exchange (LSE, CME, Eurex) is a regulated venue where a matching engine pairs orders under public rules. Off-exchange means trading privately: over the counter (OTC) directly with a dealer, or in a dark pool, where orders stay hidden until they trade.","analogy":"An exchange is a strict pub: one bar, every price on the board, the landlord decides who\'s served first. OTC is the deal done in the toilets. A dark pool is the hot tub at a dodgy villa party.","firm":{"name":"Citadel Securities","text":"A huge market maker on exchanges, and famous off-exchange too: it fills lots of US retail stock orders itself instead of sending them to an exchange. Never confuse it with Citadel, the hedge fund."},"interview":"Nobody asks \'define a future\'. They drop the word into a question: \'make me a market in this future\'. Know stock, bond, future and option in one clean sentence each, then move on.","trap":"Rambling when one sentence will do. Or saying Jane Street manages pension money. It trades its own capital.","quip":{"who":"GEORGE","text":"Eurex. Sounds like \'your ex\'. The one still texting me at 2am about German bond futures."}},"exercises":[{"type":"mcq","prompt":"What is a dark pool?","options":["An exchange that only opens outside normal trading hours","A private venue where orders stay hidden until they trade","A market for unregulated or illegal products","An order book with no market makers in it"],"answer":1,"explain":"Dark pools let big investors buy or sell loads without showing their hand. Hidden orders, not illegal ones. Less villa hot tub, more very discreet bar."},{"type":"match","prompt":"Match the product to its one-liner","pairs":[["Stock","A slice of ownership in a company"],["Bond","A loan that pays interest, then repays you"],["Future","Price agreed today, settled on a set later date"],["Option","The right, not obligation, to trade at a fixed price"]],"explain":"One sentence each is all an interviewer wants. A bond is lending your mate twenty quid, except he pays interest and actually gives it back."},{"type":"tf","statement":"The CME is mainly a stock exchange for UK company shares.","answer":false,"explain":"That\'s the LSE. The CME is in Chicago and is one of the world\'s biggest futures exchanges: interest rates, stock indices, oil, grains."},{"type":"fill","sentence":"Trading directly with a dealer instead of on an exchange is called ___.","options":["OTC","a future","a limit order","colocation"],"answer":"OTC","explain":"Over the counter. Lots of bond and currency trading works like this: you ask a bank or dealer platform for a price just for you."}]},{"concept":{"term":"The order book","definition":"A live list of resting bids (buy orders) and offers or asks (sell orders), sorted by price. Highest bid and lowest offer together are the best bid and offer (BBO, \'the touch\'). Depth is size queued at each price; tick size is the smallest price step.","analogy":"A dating app. Bids: \'I\'ll date at least a six.\' Offers: \'I need at least an eight.\' The spread is the awkward gap where nobody matches. Tick size: you can\'t rate anyone 7.3.","firm":{"name":"CME Group","text":"Exchanges set tick sizes per product. On CME, the E-mini S&P 500 future moves in 0.25 index point ticks. Market makers like Optiver and IMC quote in books like this all day."},"interview":"You\'ll get a sketched book: \'What\'s the spread? What\'s the best offer? How much can I buy there?\' Strong candidates read size as well as price, quickly and out loud.","trap":"Treating the best offer as good for any size. It\'s only good for the size actually shown.","quip":{"who":"EMMA","text":"A thin book is three shares and a tumbleweed. Basically George\'s dating profile."}},"exercises":[{"type":"mcq","prompt":"Book: bids 99p (500) and 98p (2,000). Offers 100p (300) and 101p (1,000). What\'s the best offer?","options":["101p for 1,000 shares","99p for 500 shares","100p for 300 shares","98p for 2,000 shares"],"answer":2,"explain":"Best offer = lowest price a seller will accept: 100p, but only 300 shares. 99p is the best bid. Size matters, whatever anyone tells you."},{"type":"number","prompt":"Best bid 98p, best offer 101p, tick size 0.5p. How many ticks wide is the spread?","answer":6,"tolerance":0,"unit":"ticks","explain":"Spread = 101 - 98 = 3p. Each tick is 0.5p, so 3 / 0.5 = 6 ticks."},{"type":"fill","sentence":"Another name for the offer is the ___.","options":["ask","bid","touch","tick"],"answer":"ask","explain":"Offer and ask mean the same thing. Traders say offer, textbooks say ask. The touch is the best bid and offer together."},{"type":"tf","statement":"With a 1p tick size, you can place a bid at 99.5p.","answer":false,"explain":"Tick size is the smallest step the exchange allows. With a 1p tick, it\'s 99p or 100p. No halfsies."}]},{"concept":{"term":"Limit vs market orders","definition":"A limit order trades only at your price or better; if it can\'t trade now, it rests in the book. A market order trades immediately at whatever\'s available. Buying at the offer or selling at the bid is crossing the spread: paying for immediacy.","analogy":"A limit order is patient. A market order is you in a kebab shop at 2:15am: \'Whatever you\'ve got, mate.\' You\'re fed instantly, and you pay through the nose.","firm":{"name":"Flow Traders","text":"Flow Traders, best known for ETF market making, keeps limit orders resting on both sides of the book. Investors who send market orders cross the spread against those quotes. That\'s where a market maker\'s spread comes from."},"interview":"\'Limit or market order?\' Strong answer: limit gives price certainty but may not fill; market gives execution certainty but not price. Bonus: a marketable limit order fills instantly but caps your price.","trap":"Thinking limit orders never trade instantly. A buy limit at or above the best offer fills straight away.","quip":{"who":"GEORGE","text":"Crossing the spread: paying the annoying price because I couldn\'t wait. Also how I lost my virginity."}},"exercises":[{"type":"fill","sentence":"A market buy order trades against the best ___.","options":["offer","bid","tick","depth"],"answer":"offer","explain":"To buy now, you take what sellers are showing: the best offer. You crossed from the bid side to the offer side. Kebab acquired."},{"type":"tf","statement":"A buy limit order priced above the best offer trades immediately.","answer":true,"explain":"It\'s marketable: it crosses the spread and fills against resting offers, never at a worse price than your limit. Limit doesn\'t mean slow."},{"type":"number","prompt":"Bid 99p, offer 100p. You market-buy 1,000 shares. How much more than the mid-price did you pay in total, in pounds?","answer":5,"tolerance":0,"unit":"£","explain":"Mid = 99.5p. You paid 100p, so 0.5p (half the spread) per share. 0.5p × 1,000 = 500p = £5. That\'s the price of impatience."},{"type":"mcq","prompt":"Which order guarantees execution but not price?","options":["A limit sell above the best offer","A bid below the best bid","A limit order","A market order"],"answer":3,"explain":"Market orders always fill (if there\'s anything in the book), at whatever price it takes. Limit orders guarantee price, not execution."}]},{"concept":{"term":"Lifted vs hit","definition":"Buyers lift offers; sellers hit bids. If you\'re quoting and get lifted, someone bought from you, so you sold. If you get hit, someone sold to you, so you bought. The word describes what they did to your quote.","analogy":"Get hit and you\'re left holding it, like getting hit with a baby you didn\'t plan for. Get lifted and it\'s gone, like your wallet in Camden.","firm":{"name":"Jane Street","text":"In market-making games, widely reported at Jane Street and other trading firms, the interviewer trades against your quotes. \'I lift your offer\' means you just sold. Say your new position out loud."},"interview":"\'You got lifted on 50.\' Strong candidates instantly say \'I\'m short 50\', then think about why they\'re buying and adjust prices. Hesitating here looks bad fast.","trap":"Hearing \'I got hit\' and thinking you sold. Hit means you bought.","quip":{"who":"EMMA","text":"Get lifted, say \'great, I bought fifty\', and the interview room goes quieter than a morgue."}},"exercises":[{"type":"fill","sentence":"Buyers ___ offers, sellers hit bids.","options":["lift","hit","cross","take"],"answer":"lift","explain":"Buyers lift offers out of the book. Sellers hit bids. If you\'re the one quoting, flip it: lifted = you sold, hit = you bought."},{"type":"mcq","prompt":"You quote 99 bid, 100 offer. A trader says \'I lifted you.\' What happened?","options":["You sold at 100","You bought at 100","You bought at 99","You sold at 99"],"answer":0,"explain":"They lifted your offer at 100. They bought, so you sold. Like your wallet in Camden: lifted means it left you."},{"type":"number","prompt":"You quote 50 bid, 51 offer. You get lifted on 20, hit on 50, then lifted on 10. What\'s your position? (Long = positive, short = negative.)","answer":20,"tolerance":0,"unit":"shares","explain":"Lifted = you sold: -20. Hit = you bought: +50. Lifted again: -10. Net +20, so you\'re long 20."},{"type":"interview","question":"Market-making game. You quote 99 at 100. Interviewer: \'I lift you on 50.\' What\'s your position, and what now?","options":[{"text":"Great, I bought 50 at my offer. I\'m long 50 and I\'ll keep quoting 99 at 100.","verdict":"weak","why":"Got lifted backwards. Lifted means you sold. Room goes silent."},{"text":"I sold 50 at 100, so I\'m short 50. I earned half the spread, so I\'ll keep my quotes where they are.","verdict":"okay","why":"Position right, but ignores that the buyer may know something."},{"text":"I\'m short 50 at 100. They wanted it, which hints value might be higher, so I\'d nudge my bid and offer up a bit and keep tracking my position.","verdict":"strong","why":"Correct position, treats the trade as information, updates out loud."}],"answer":2,"explain":"Interviewers want three things said aloud: your position, what the trade tells you, and how you\'ll move your prices. A fill isn\'t always a pat on the back."}]},{"concept":{"term":"Price-time priority","definition":"The usual matching rule: the best price fills first; at the same price, whoever arrived first fills first. Some futures markets use pro rata instead, sharing fills at a price by order size. Because queue position is valuable, speed matters.","analogy":"The bar queue. Whoever waves the biggest note gets served first. Two people waving the same tenner? Whoever got to the bar first.","firm":{"name":"IMC","text":"Trading firms like IMC invest heavily in low-latency technology and colocation: servers in the same data centre as the exchange\'s matching engine. Under price-time priority, microseconds decide who\'s first in the queue."},"interview":"\'Why does speed matter to market makers?\' Strong answer: queue position under price-time priority, plus cancelling or updating stale quotes before faster traders pick them off.","trap":"Thinking time beats price. A better price always jumps the queue, however late it arrives.","quip":{"who":"GEORGE","text":"Pro rata shares fills out by size. Finally, a system where size actually matters."}},"exercises":[{"type":"order","prompt":"Price-time priority: put these bids in fill order, first to last","items":["D: 100p, arrived 9:01","B: 100p, arrived 9:02","C: 99p, arrived 8:59","A: 99p, arrived 9:00"],"explain":"Price first: both 100p bids beat both 99p bids. Then time within each price: D before B, C before A. C being earliest doesn\'t help it."},{"type":"number","prompt":"Bids at 100p, in arrival order: A 300, B 500, C 200. A sell order for 600 hits 100p. Under price-time priority, how many shares does B get?","answer":300,"tolerance":0,"unit":"shares","explain":"A arrived first and fills all 300. That leaves 300 for B. C gets nothing. Same price, so it\'s purely first come, first served."},{"type":"tf","statement":"Under pure pro rata, a 600-lot bid out of 1,000 lots total at a price gets about 60% of an incoming fill there.","answer":true,"explain":"Pro rata shares fills by size, not arrival time. Real markets add tweaks like rounding and minimums, but size is the core idea."},{"type":"mcq","prompt":"Why do trading firms pay for colocation?","options":["Exchanges require every trader to colocate","To see other firms\' hidden orders","To cut latency and win queue position","Data centre rent is cheaper than offices"],"answer":2,"explain":"Colocation puts your servers next to the matching engine, cutting latency. Under price-time priority, being first at a price gets you filled."}]},{"concept":{"term":"Spread, liquidity, slippage","definition":"Liquidity is how easily you trade decent size quickly without moving the price: tight spreads, deep book. Slippage is the gap between the price you expected and the price you got. Market impact is the price moving because of your own trading.","analogy":"Pounds to euros at a big bank: tiny spread. Airport bureau de change: massive spread, because you\'re desperate, they\'ve no competition, and you get bent over at departures.","firm":{"name":"Optiver","text":"Market makers like Optiver earn the spread but carry inventory risk and the risk of trading with better-informed people. When markets get wild, those risks rise, so quotes widen. Expect \'why do spreads widen?\' questions."},"interview":"\'Why is a small cap\'s spread wider than a FTSE 100 giant\'s?\' Strong answer, three parts: less competition, harder to offload inventory, more chance the other side knows something.","trap":"\'Because it\'s riskier\', full stop. Or \'greedy market makers\'. Break risk into competition, inventory and information.","quip":{"who":"GEORGE","text":"Everyone loves a tight spread. That\'s all I\'m saying, Emma."}},"exercises":[{"type":"match","prompt":"Match the term to its meaning","pairs":[["Liquidity","Ease of trading size without moving the price"],["Slippage","Gap between expected and actual fill price"],["Market impact","Price moving because of your own trading"],["Inventory risk","Price moving against a position you\'re holding"],["Adverse selection","The other side knows more than you"]],"explain":"Spreads pay market makers for inventory risk and adverse selection. Slippage and market impact are what big, impatient traders pay. Like Chelsea in a transfer window."},{"type":"number","prompt":"Bid 199p, offer 201p. What\'s the spread in basis points of the mid-price?","answer":100,"tolerance":0,"unit":"bps","explain":"Spread = 2p, mid = 200p. 2 / 200 = 1%. One basis point is 0.01%, so 1% = 100 bps. Wide. A big liquid stock is usually a few bps."},{"type":"interview","question":"Why do bid-ask spreads widen during a market crisis?","options":[{"text":"Because it\'s riskier, so market makers charge more.","verdict":"weak","why":"True but lazy. Doesn\'t break risk into parts."},{"text":"Volatility makes holding inventory riskier, informed traders are more likely, and some market makers pull back, so there\'s less competition. Wider quotes pay for all three.","verdict":"strong","why":"Inventory, information and competition, cleanly separated."},{"text":"Prices jump around more, so holding a position is riskier, and market makers widen quotes to cover it.","verdict":"okay","why":"Correct, but only one of the three reasons."}],"answer":1,"explain":"The three-part answer works for small caps too: competition, inventory risk, information. Say all three and you sound like a trader, not a textbook."}]}],"finale":[{"type":"number","prompt":"Offers: 100p (300), 101p (500), 102p (1,000). You send a market buy for 1,000 shares. What\'s your average price, in pence?","answer":100.9,"tolerance":0,"unit":"pence","explain":"300 × 100 = 30,000. 500 × 101 = 50,500. The last 200 × 102 = 20,400. Total 100,900p ÷ 1,000 = 100.9p. You ate through the book."},{"type":"number","prompt":"Same trade. You expected to pay the best offer, 100p, on every share. What was your total slippage, in pounds?","answer":9,"tolerance":0,"unit":"£","explain":"Average 100.9p vs 100p = 0.9p per share. 0.9p × 1,000 = 900p = £9. The best offer was only good for 300 shares."},{"type":"interview","question":"You need to buy 50,000 shares of a thinly traded small cap. How do you do it?","options":[{"text":"Send one market order for all 50,000 so it\'s done instantly, before the price can move.","verdict":"weak","why":"Walks straight up a thin book. Huge slippage and market impact."},{"text":"Split it into small pieces over time, mostly passive limit orders, maybe using a dark pool or block broker, balancing market impact against the price drifting away.","verdict":"strong","why":"Names the real trade-off: impact versus timing risk."},{"text":"Use one big limit order at today\'s offer, so I never pay more than that.","verdict":"okay","why":"Caps price, but shows your hand and may never fill."}],"answer":1,"explain":"Big orders in thin markets move prices against you. Strong candidates trade patiently, hide size where they can, and say out loud what they\'re trading off."}],"teaser":"Tomorrow, Day 2, we go software engineering: Big O. Why your \'quick\' nested loop takes longer than George on the toilet.","flashcards":[{"front":"Exchange vs OTC?","back":"<b>Exchange</b> (LSE, CME, Eurex): regulated venue, matching engine, public rules.<br><b>OTC</b>: trading directly with a dealer, privately.<br>Analogy: the strict pub bar vs the deal in the toilets."},{"front":"What is a dark pool?","back":"A private venue where orders stay hidden until they trade, so big investors can trade size without showing their hand.<br>Analogy: the hot tub at a dodgy villa party."},{"front":"Future vs option?","back":"<b>Future</b>: obligation to buy/sell at a price agreed today, settled on a set later date. Exchange traded.<br><b>Option</b>: the right, not obligation, to buy/sell at a fixed price. You pay a premium for it.<br>Analogy: pre-ordering a game vs a holiday deposit."},{"front":"Bid, offer, BBO?","back":"<b>Bid</b>: price someone will buy at. <b>Offer</b> (ask): price someone will sell at.<br><b>BBO</b> (the touch): highest bid + lowest offer. The gap is the bid-ask spread.<br>Analogy: the dating app gap where nobody matches."},{"front":"Depth and tick size?","back":"<b>Depth</b>: how much size is queued at each price level, and how far back it goes.<br><b>Tick size</b>: smallest allowed price step, set by the exchange.<br>Analogy: no rating anyone 7.3."},{"front":"Limit order vs market order?","back":"<b>Limit</b>: trades only at your price or better; rests in the book if it can\'t fill.<br><b>Market</b>: fills now at whatever\'s available.<br>Analogy: patient diner vs 2am kebab shop."},{"front":"Lifted vs hit?","back":"Buyers <b>lift</b> offers; sellers <b>hit</b> bids.<br>If you\'re quoting: lifted = you <b>sold</b>; hit = you <b>bought</b>.<br>Analogy: lifted like your wallet in Camden; hit and left holding it."},{"front":"Price-time priority?","back":"Best price fills first; at the same price, earliest order fills first.<br>Some futures markets use <b>pro rata</b> instead: fills shared by size.<br>Analogy: biggest note at the bar first, then whoever got there first."},{"front":"What is liquidity?","back":"How easily you can trade a decent size quickly without moving the price. Liquid = tight spreads and a deep book.<br>Analogy: big bank FX rate vs airport bureau de change."},{"front":"Slippage vs market impact?","back":"<b>Slippage</b>: gap between the price you expected and the price you got.<br><b>Market impact</b>: price moving because of your own trading (a big cause of slippage).<br>Analogy: the price of a striker jumps once the club knows you want him."},{"front":"You quote 99 at 100 and get lifted on 50. Position?","back":"Short 50 at 100. Lifted means someone bought your offer, so you sold.<br>Then treat it as information: the buyer may know more, so consider moving prices up.<br>Trap: saying \'I bought 50\'."},{"front":"Offers: 100p (300), 101p (500). Market buy 800. Average price?","back":"300 × 100 + 500 × 101 = 80,500p. ÷ 800 = <b>100.625p</b>.<br>Walk the book level by level.<br>Trap: saying 800 at 100p. The best offer is only good for 300."},{"front":"You buy at the offer and immediately sell at the bid. What did it cost?","back":"The full bid-ask spread per share (half the spread each way, measured from mid).<br>That\'s the cost of crossing the spread twice for immediacy."},{"front":"Limit or market order: what\'s the trade-off?","back":"Limit gives price certainty but may not fill. Market gives execution certainty but not price.<br>A limit order priced through the other side fills instantly but caps your price."},{"front":"Why is a small cap\'s spread wider than a large cap\'s?","back":"Three reasons: <b>competition</b> (fewer market makers), <b>inventory risk</b> (harder to offload a position), <b>information</b> (more chance the other side knows something).<br>Trap: just \'it\'s riskier\'."},{"front":"Why do spreads widen in a crisis?","back":"Volatility raises inventory risk, informed or forced traders are more common, and some market makers pull back, cutting competition. Wider quotes compensate for all three."},{"front":"Why does speed matter to market makers?","back":"Under price-time priority, being first at a price gets you filled. Speed also lets you cancel stale quotes before faster traders pick you off. Hence low latency and colocation."},{"front":"How would you buy 50,000 shares of an illiquid stock?","back":"Split it over time, mostly passive limit orders, maybe a dark pool or block broker. Balance market impact against the price drifting while you wait.<br>Trap: one giant market order."},{"front":"Bid 199p, offer 201p. Spread in basis points?","back":"Spread 2p ÷ mid 200p = 1% = <b>100 bps</b>.<br>1 basis point = 0.01%."},{"front":"Citadel vs Citadel Securities?","back":"<b>Citadel Securities</b>: a market maker, big in equities and US retail order flow.<br><b>Citadel</b>: a multi-strategy hedge fund.<br>Separate companies, same founder. Mix them up and it looks like you did no research."}]}');var es={};es=JSON.parse('{"id":"w1d2","week":1,"day":2,"track":"swe","title":"Big O, Big Deal","subtitle":"Growth rates, trade-offs and talking complexity","intro":[{"who":"GEORGE","text":"Pub crawl script update. Twenty pubs, every possible order. The laptop is now hot enough to fry a full English on."},{"who":"EMMA","text":"Twenty factorial is about 2.4 quintillion routes. At a billion a second, that\'s roughly 77 years. Kill it, George."},{"who":"GEORGE","text":"But I\'ve invested so much. Emotionally. Electrically. My room smells like burnt toast."},{"who":"EMMA","text":"Your code isn\'t slow, it has the wrong growth rate. Today: Big O, and how to talk about it without sounding like a muppet."},{"who":"GEORGE","text":"Big O. I promise to be mature about the name. I\'m already failing."}],"units":[{"concept":{"term":"Big O notation","definition":"Describes how an algorithm\'s running time or memory grows as the input size n gets huge. Keep the dominant term, drop constants and smaller terms: 3n² + 5n + 2 is O(n²). Usually quoted for the worst case.","analogy":"Getting a round in. Pints poured one by one: double the mates, double the wait, O(n). Every mate clinks with every other mate first: double the mates, four times the clinking, O(n²).","firm":{"name":"Google","text":"At Google and Meta, finishing the code is half the job. Expect \'what\'s the time and space complexity?\' straight after, then \'can you do better?\'"},"interview":"Asked after almost every solution. A strong answer gives the bound, the case and the reason: \'O(n) worst case, one pass, constant work per element, plus O(n) extra space for the map.\'","trap":"Saying \'it\'s quite fast\'. Or missing hidden costs: list slicing copies, \'in\' on a list scans, and sorting is never free.","quip":{"who":"GEORGE","text":"So ten pints and thirty pints are the same growth class. Namely: going to be sick."}},"exercises":[{"type":"mcq","prompt":"Simplify 4n² + 100n + 7000 in Big O.","options":["O(n²)","O(4n²)","O(n² + n)","O(7000)"],"answer":0,"explain":"Keep the dominant term, bin the constants. When n is a billion, 100n and 7000 are rounding errors next to n²."},{"type":"tf","statement":"Strictly speaking, linear search is O(n²), because Big O is only an upper bound.","answer":true,"explain":"O is an upper bound, Ω a lower bound, Θ a tight bound. Technically true, but in interviews \'Big O\' means the tight bound. Say O(n) unless you want to be a pedantic arsehole."},{"type":"fill","sentence":"Linear search checks about n/2 items on average, which in simplified Big O is still ___.","options":["O(n)","O(n/2)","O(log n)","O(1)"],"answer":"O(n)","explain":"Halving is a constant factor, and constants get dropped. Best case O(1), average and worst case O(n). Say which case you mean."}]},{"concept":{"term":"O(1) and O(log n)","definition":"O(1), constant: the cost doesn\'t grow with n, like reading array[i] or an average hash map lookup. O(log n), logarithmic: each step throws away half of what\'s left, like binary search on a sorted array.","analogy":"Guess my number from 1 to 100, higher or lower. Start at 50 and halve each time: never more than 7 guesses. A million numbers? 20. A billion? About 30.","firm":{"name":"Bloomberg","text":"Bloomberg\'s software interviews are widely reported to be heavy on data structures. Spotting that sorted input means binary search, O(log n) instead of O(n), is exactly the reflex they want to see."},"interview":"\'Find a value in this sorted array\' really means \'do you see the halving?\' Strong answer: binary search, O(log n) time, O(1) space, and it only works because the data is sorted.","trap":"Binary search on unsorted data. Also, constant doesn\'t mean instant: a one-second O(1) operation is just a slow constant.","quip":{"who":"EMMA","text":"Log n means how many halvings until you hit 1. Not a log in a river, George. Or the toilet."}},"exercises":[{"type":"number","prompt":"Higher-or-lower, number from 1 to 1,000,000. With the best strategy, how many guesses do you need in the worst case?","answer":20,"tolerance":0,"unit":"guesses","explain":"2²⁰ = 1,048,576, just over a million, so 20 halvings always pin it. 1 to 1,000 needs 10. A thousand times more numbers, only 10 more guesses."},{"type":"match","prompt":"Match the operation to its cost","pairs":[["Dict lookup","O(1) on average: hash straight to the bucket"],["Array by index","O(1): start address plus index times size"],["Binary search","O(log n): halve the sorted range each step"],["x in list","O(n): quietly scans every element"]],"explain":"Two flavours of constant: hashing and address arithmetic. Halving gives log n. And Python\'s \'in\' on a list is a hidden linear scan, a classic interview gotcha."},{"type":"tf","statement":"Binary search on an unsorted array still finds the target in O(log n).","answer":false,"explain":"Halving only works if \'higher or lower\' means something. Unsorted, the half you bin might hold the target. Sorting first costs O(n log n)."},{"type":"mcq","prompt":"A sorted array grows from 1,000 to 1,000,000 items. Binary search worst case goes from about 10 steps to about...","options":["20 steps","10,000 steps","1,000 steps","11 steps"],"answer":0,"explain":"log₂ of a million is about 20. The input got a thousand times bigger and the cost went up by 10 steps. That\'s why log n is Premier League."}]},{"concept":{"term":"O(n) and O(n log n)","definition":"O(n), linear: touch each item a fixed number of times, like one loop to find a max. O(n log n): the cost of good comparison sorts like merge sort and Timsort (Python\'s built-in): about log n levels, n work per level.","analogy":"Sorting exam scripts with mates: split the pile in half, again and again, everyone sorts a tiny pile, then merge pairs of piles back. Log n rounds of splitting, every script touched each round.","firm":{"name":"Amazon","text":"Online assessments at firms like Amazon run on HackerRank-style platforms with hidden tests on big inputs. A sort-then-scan O(n log n) solution often passes where an O(n²) double loop times out."},"interview":"\'Can you sort faster than n log n?\' Strong answer: not by comparisons alone, that\'s a proven lower bound. But small integers in a known range? Counting sort, linear time.","trap":"Thinking you can find the max of unsorted data in less than O(n). Skip one item and it might be the biggest.","quip":{"who":"GEORGE","text":"N log n: the awkward middle child. Not as fit as linear, not as grim as squared."}},"exercises":[{"type":"mcq","prompt":"Find the largest value in an unsorted list of n numbers. Best possible worst-case time?","options":["O(n)","O(log n)","O(1)","O(n log n)"],"answer":0,"explain":"Any correct method must read every item, because the one you skip could be the max. That\'s a lower bound argument, and interviewers love hearing it."},{"type":"number","prompt":"Merge sort on 1,024 items. How many levels of halving until every pile holds one item?","answer":10,"tolerance":0,"unit":"levels","explain":"2¹⁰ = 1,024, so 10 levels. Each level merges all 1,024 items, so roughly 10 × 1,024 work. That\'s n log n in the flesh."},{"type":"tf","statement":"Any comparison-based sort needs on the order of n log n comparisons in the worst case.","answer":true,"explain":"There are n! possible orderings and each comparison is a yes/no question, so you need about log₂(n!) ≈ n log n of them. Counting sort dodges this by not comparing."},{"type":"interview","question":"Interviewer: \'Your solution sorts the input, then does one pass. What\'s the complexity?\'","options":[{"text":"O(n), because after sorting it\'s just one loop over the array.","verdict":"weak","why":"Ignores the sort. Sorting is never free."},{"text":"O(n log n) time: the sort dominates and the scan is O(n). Space depends on the sort; Python\'s Timsort can use O(n) extra.","verdict":"strong","why":"Names both steps, keeps the dominant term, covers space."},{"text":"O(n log n), since sorting is n log n.","verdict":"okay","why":"Right answer, but no reasoning about the scan or space."}],"answer":1,"explain":"O(n log n) + O(n) = O(n log n). Add the steps, keep the biggest. Mentioning space unprompted is free marks."}]},{"concept":{"term":"O(n²), O(2ⁿ), O(n!)","definition":"O(n²): a loop inside a loop, every item against every other. O(2ⁿ): every subset, each item in or out. O(n!): every ordering. Fine for tiny n, a disaster soon after.","analogy":"George\'s pub crawl: 20 pubs, every ordering. That\'s 20! ≈ 2.4 quintillion routes. At a billion a second, about 77 years. His liver files for divorce long before.","firm":{"name":"Goldman Sachs","text":"Bank tech schemes like Goldman Sachs often start with a timed HackerRank-style online test. Hidden tests in these usually include big inputs: if n can reach 100,000, O(n²) will likely time out."},"interview":"\'What\'s the complexity of this nested loop?\' Weak: \'nested, so n².\' Strong: count it. The inner loop runs from i+1 to n, so about n²/2 steps, still O(n²).","trap":"Assuming every nested loop is n². Inner loop over 26 letters? O(n). Inner loop that halves? O(n log n). Count, don\'t pattern-match.","quip":{"who":"EMMA","text":"Twenty toppings, 2²⁰ pizzas. Pineapple, anchovy and jalapeño is one. Your toilet remembers it fondly."}},"exercises":[{"type":"order","prompt":"Order from slowest-growing to fastest-growing","items":["O(log n)","O(n log n)","O(n²)","O(2ⁿ)","O(n!)"],"explain":"Cheeky Lads Never Need Snogs, Except Fridays: constant, log, n, n log n, squared, exponential, factorial. n! overtakes 2ⁿ from n = 4 (24 vs 16)."},{"type":"number","prompt":"Five-a-side league of 10 teams. Every team plays every other team once. How many matches?","answer":45,"tolerance":0,"unit":"matches","explain":"n(n−1)/2 = 10 × 9 / 2 = 45. Every pair is the n² pattern: 100 teams would mean 4,950 matches and a lot of knackered legs."},{"type":"mcq","prompt":"Brute force tries every subset of 30 items. Roughly how many subsets?","options":["About a billion","About 900","About 435","About 30 million"],"answer":0,"explain":"Each item is in or out: 2³⁰ ≈ 1.07 billion. Add one item and the work doubles. 900 is n², 435 is the number of pairs."},{"type":"fill","sentence":"Trying every ordering of n items, like George\'s pub crawl, costs ___.","options":["O(n!)","O(2ⁿ)","O(n²)","O(n log n)"],"answer":"O(n!)","explain":"n choices of first pub, n−1 for the second, and so on: n!. Ten pubs is 3,628,800 routes. Brute-force travelling salesman is exactly this."}]},{"concept":{"term":"Time vs space trade-off","definition":"Space complexity is the extra memory an algorithm needs as n grows, measured in Big O. You can often buy speed with memory: store what you\'ve already seen so you never rescan it.","analogy":"Sunday meal prep. Twenty tupperwares of chicken and rice rammed in the fridge, but lunch takes ten seconds all week. The fridge is beige and your flatmates hate you. That\'s the memory cost.","firm":{"name":"Meta","text":"In Meta and Google style interviews the follow-up is predictable: \'Great, now what if memory is tight?\' They want you to know both ends of the trade-off, not just one solution."},"interview":"\'Does this list contain duplicates?\' Strong answer gives three: compare all pairs, O(n²) time, O(1) space; hash set, O(n) average time, O(n) space; sort then scan, O(n log n), little extra space.","trap":"Calling a recursive solution O(1) space. Every call sits on the call stack, so recursion n levels deep uses O(n) space.","quip":{"who":"GEORGE","text":"Memory is the fridge, speed is lunch, and my flatmates are the hidden cost."}},"exercises":[{"type":"interview","question":"Interviewer: \'Check whether an array contains any duplicates. Talk me through it.\'","options":[{"text":"Loop over each element and check \'if x in the rest of the list\'. One loop, so O(n).","verdict":"weak","why":"\'in\' on a list is a hidden scan. That\'s O(n²)."},{"text":"Use a hash set, it\'s O(1).","verdict":"okay","why":"Right tool, wrong claim: the whole thing is O(n), and no space mentioned."},{"text":"Brute force compares every pair: O(n²) time, O(1) space. Better: one pass with a hash set, O(n) average time, O(n) space. If memory\'s tight, sort and scan neighbours.","verdict":"strong","why":"Brute force first, then the trade-off, with costs."}],"answer":2,"explain":"Trade O(n) memory to drop from n² to n time. Naming brute force, then optimising, then the low-memory option is the script interviewers want."},{"type":"match","prompt":"Match the approach to its cost","pairs":[["Compare every pair","O(n²) time, O(1) extra space"],["Hash set pass","O(n) average time, O(n) extra space"],["Sort, scan neighbours","O(n log n) time, little extra space if in-place"],["Recursion n deep","O(n) space from the call stack"]],"explain":"Same problem, three price tags: pick based on n and memory. And recursion\'s memory bill is the one everyone forgets."},{"type":"tf","statement":"A recursive function that goes n levels deep, but never creates a list, uses O(1) extra space.","answer":false,"explain":"Each call pushes a frame onto the call stack, so n levels is O(n) space. Python taps out at about 1,000 levels by default with a RecursionError."},{"type":"number","prompt":"n = 100,000. Checking every pair takes about n²/2 comparisons. How many billion is that?","answer":5,"tolerance":0,"unit":"billion","explain":"100,000² = 10¹⁰, halved is 5 billion. In Python that\'s minutes, not milliseconds. The hash set version does about 100,000 lookups."}]},{"concept":{"term":"Amortised complexity","definition":"The average cost per operation over a whole sequence of operations, rare expensive ones included. It\'s a guarantee, not luck: even the worst possible sequence of n appends to a dynamic array costs O(n) in total.","analogy":"Moving house. Most days you just add stuff to a shelf. When the flat\'s full you move somewhere twice the size and carry every box. Hell, but each move buys twice as long before the next.","firm":{"name":"Optiver","text":"Low-latency market makers like Optiver care about the worst single operation, not just the average. One resize in the middle of sending an order is a latency spike, so trading code often preallocates memory."},"interview":"\'Is appending to a Python list O(1)?\' Strong: amortised O(1). One append can be O(n) when it resizes and copies, but growing by a constant factor keeps n appends at O(n) total.","trap":"Confusing amortised with average case. Average case is about random inputs; amortised is a guarantee over any sequence of operations.","quip":{"who":"GEORGE","text":"Appending is like my nights out. Usually cheap, occasionally catastrophic, but it averages out."}},"exercises":[{"type":"number","prompt":"A dynamic array starts with capacity 1 and doubles when full. You append 16 items. How many element copies happen during resizes?","answer":15,"tolerance":0,"unit":"copies","explain":"Resizes on appends 2, 3, 5 and 9 copy 1 + 2 + 4 + 8 = 15 items. Under 2n in total, so constant work per append: amortised O(1)."},{"type":"mcq","prompt":"An array grows by a fixed 10 extra slots each time it fills. Total cost of n appends?","options":["O(n²)","O(n)","O(n log n)","O(1)"],"answer":0,"explain":"Copies go 10 + 20 + 30 + ... ≈ n²/20. That\'s O(n²) total, O(n) per append. Grow by a factor, not a fixed amount, or the maths breaks."},{"type":"tf","statement":"Python\'s list.pop(0) is O(1), so a plain list makes a fine queue.","answer":false,"explain":"Popping the front shuffles every remaining element down a slot: O(n). Use collections.deque for O(1) at both ends."},{"type":"interview","question":"Interviewer: \'Is appending to a Python list O(1)?\'","options":[{"text":"Amortised O(1). When it\'s full it allocates a bigger block and copies everything, O(n) for that append, but growth by a constant factor makes n appends O(n) total.","verdict":"strong","why":"Says amortised, gives the worst single op, explains why."},{"text":"Yes, always O(1).","verdict":"weak","why":"Ignores resizing. A sharp interviewer replies: \'Always?\'"},{"text":"It\'s O(n), because it sometimes has to copy the whole list.","verdict":"okay","why":"True for one unlucky append, misses the amortised picture."}],"answer":0,"explain":"Bonus depth: CPython over-allocates by roughly an eighth rather than doubling, but any constant growth factor still gives amortised O(1)."}]}],"finale":[{"type":"mcq","prompt":"Code: \'for i in 1..n: j = 1; while j < n: j = j * 2\'. Complexity?","options":["O(n log n)","O(n²)","O(n)","O(log n)"],"answer":0,"explain":"The outer loop runs n times. The inner loop doubles j until it reaches n: about log₂ n steps. n × log n. Doubling is just halving in disguise."},{"type":"match","prompt":"Match each described snippet to its complexity","pairs":[["O(n)","For each of n words, loop over 26 letters"],["O(log n)","While n > 1, halve n"],["O(n²)","For i in range(n), for j in range(i+1, n)"],["O(2ⁿ)","Naive recursive fib(n) = fib(n−1) + fib(n−2)"],["O(n log n)","Sort the list, then one pass over it"]],"explain":"26 is a constant, so that inner loop doesn\'t change the growth. Pairs i < j give n²/2. Naive fib\'s tight bound is about 1.618ⁿ, but O(2ⁿ) is the standard answer."},{"type":"interview","question":"Interviewer: \'Talk me through the complexity of your solution.\' (It makes one pass and uses a dict.)","options":[{"text":"Time is O(n) for the loop and space is O(n) for the dict.","verdict":"okay","why":"Correct, but no why, no average vs worst case, no lower bound."},{"text":"It\'s O(n), so pretty efficient I think.","verdict":"weak","why":"No reasoning, no space, no case. \'I think\' helps nobody."},{"text":"O(n) time: one pass, dict operations are O(1) on average, worse only if keys all collide. O(n) extra space for the dict. Can\'t beat O(n): every element must be read.","verdict":"strong","why":"Bound, reason, case, space and a lower bound."}],"answer":2,"explain":"The script: the number, why, which case, space, then whether you can do better. Firms like Jane Street and Optiver value that clean reasoning over fast typing."}],"teaser":"Tomorrow, Day 3, data science: distributions and averages. Why one billionaire walking into the pub wrecks the mean but not the median.","flashcards":[{"front":"What is Big O notation?","back":"How an algorithm\'s time or memory grows as input size n gets huge. Keep the dominant term, drop constants: 3n² + 5n + 2 is O(n²).<br>Analogy: pouring pints grows like n, everyone clinking glasses grows like n²."},{"front":"Big O vs Big Theta vs Big Omega?","back":"O: upper bound (no worse than). Ω: lower bound (at least). Θ: tight bound (both). In interviews \'Big O\' usually means the tight bound.<br>Analogy: O is the ceiling, Ω the floor, Θ is when they meet."},{"front":"Worst case vs average case?","back":"Worst case: most work on any input of size n. Average case: expected work over typical inputs. Linear search: best O(1), average and worst O(n).<br>Analogy: your keys are in the last of ten pockets."},{"front":"What is O(1), constant time?","back":"Cost doesn\'t grow with n: array index, average hash map lookup. Constant isn\'t instant, just flat.<br>Analogy: a cloakroom ticket takes you straight to hook 212, however many coats there are."},{"front":"What is O(log n)?","back":"Each step throws away half the problem; log₂ n is how many halvings reach 1. 100 items: 7 steps. A million: 20. A billion: about 30.<br>Analogy: higher-or-lower number guessing."},{"front":"What is O(n log n)?","back":"The cost of good comparison sorts: merge sort, heap sort, Timsort (Python\'s sort). About log n levels of splitting, n work per level.<br>Analogy: split exam scripts among mates, then merge the sorted piles back."},{"front":"What is O(n²)?","back":"Every item against every other, usually a nested loop. At n = 100,000 that\'s about 10¹⁰ steps: a timeout.<br>Analogy: a stag do where everyone clinks glasses with everyone before anyone drinks."},{"front":"What are O(2ⁿ) and O(n!)?","back":"2ⁿ: every subset (each item in or out). n!: every ordering. Only feasible for tiny n.<br>Analogy: a 20-pub crawl has 20! ≈ 2.4 quintillion routes, about 77 years at a billion a second."},{"front":"What is space complexity?","back":"The extra (auxiliary) memory an algorithm needs as n grows, in Big O. Recursion counts: n levels deep is O(n) stack space.<br>Analogy: meal prep fills the fridge so lunch is instant."},{"front":"What is amortised complexity?","back":"Average cost per operation over any sequence, expensive ones included. A guarantee, not about random inputs. Dynamic array append is amortised O(1).<br>Analogy: rarely moving to a house twice the size."},{"front":"Interview: \'What\'s the complexity of your solution?\'","back":"Give the bound, the reason and the case: \'O(n) time, one pass with O(1) average dict operations; O(n) extra space for the dict.\' Then say whether you can do better.<br>Trap: \'It\'s quite fast.\'"},{"front":"Interview: \'Is a hash map lookup O(1)?\'","back":"O(1) on average, with a decent hash function and resizing to keep the load factor low. Worst case O(n) if every key collides into one bucket.<br>Trap: just saying \'O(1)\'."},{"front":"Interview: \'Is appending to a Python list O(1)?\'","back":"Amortised O(1). When full, the list allocates a bigger block and copies, O(n) for that one append, but constant-factor growth keeps n appends at O(n) total.<br>Trap: \'Always O(1).\'"},{"front":"Interview: \'Why can\'t comparison sorting beat n log n?\'","back":"There are n! orderings and each comparison is a yes/no answer, so you need about log₂(n!) ≈ n log n comparisons in the worst case. Counting sort beats it on small integer ranges by not comparing."},{"front":"Interview: \'Check an array for duplicates. Options?\'","back":"All pairs: O(n²) time, O(1) space. Hash set: O(n) average time, O(n) space. Sort then scan neighbours: O(n log n) time, little extra space. Choose by memory limits."},{"front":"Interview: \'Is this nested loop O(n²)?\'","back":"Count, don\'t pattern-match. Inner loop over a fixed 26 letters: O(n). Inner loop that halves: O(n log n). Inner loop from i+1 to n: about n²/2, so O(n²).<br>Trap: \'nested means n².\'"},{"front":"Interview: \'Can you find the max of an unsorted list faster than O(n)?\'","back":"No. Any correct algorithm must read every element, because a skipped one might be the max. That\'s a lower bound of Ω(n)."},{"front":"Interview: \'When does binary search work, and what does it cost?\'","back":"Only on sorted data. O(log n) time, O(1) space if iterative. Sorting first costs O(n log n), so it pays off for repeated searches.<br>Trap: binary search on unsorted data."},{"front":"Interview: \'Your O(n²) solution times out at n = 100,000. Now what?\'","back":"Read the limits as a hint: they want O(n) or O(n log n). Find the repeated work, usually a scan, and remove it with a hash map or by sorting first."},{"front":"Interview: \'Why not use a Python list as a queue?\'","back":"list.pop(0) shifts every remaining element down a slot: O(n). Use collections.deque, which is O(1) at both ends.<br>Trap: assuming every list operation is O(1)."}]}');var el={};el=JSON.parse('{"id":"w1d3","week":1,"day":3,"track":"ds","title":"Distributions Decoded","subtitle":"Bell curves, fat tails and billionaires in pubs","intro":[{"who":"GEORGE","text":"Emma, my Hinge matches follow a Poisson distribution. Rate: about zero per week."},{"who":"EMMA","text":"That\'s not a distribution, mate, that\'s a diagnosis."},{"who":"GEORGE","text":"Fine. Why should I give a toss about distributions anyway?"},{"who":"EMMA","text":"Every metric has a shape. Get the shape wrong and you report the wrong average, miss the crash risk and bomb the interview."},{"who":"GEORGE","text":"Shapes. Like the one I left in the bog this morning. Right skew, fat tail."}],"units":[{"concept":{"term":"Random variables: PMF, PDF, CDF","definition":"A random variable is a number decided by chance. Discrete ones you count; continuous ones you measure. The PMF gives the probability of each exact value. The PDF gives density: area under it is probability. The CDF gives P(X ≤ x).","analogy":"PMF is a bookie\'s board: odds for every exact score. PDF is how rammed each bit of the Tube platform is; you need a stretch, not a point, to count heads. CDF is a progress bar to one.","firm":{"name":"Two Sigma","text":"Quant funds like Two Sigma test probability fluency early. Expect quick checks like \'PDF vs CDF?\' or \'given the CDF, find the PDF\' before the harder questions arrive."},"interview":"\'Can a density be above 1?\' Strong: yes, density isn\'t probability, only area is. Uniform on [0, 0.5] has density 2. Bonus: any exact point of a continuous variable has probability 0.","trap":"Saying \'the PDF gives the probability of a value\'. For a continuous variable, any single exact value has probability zero.","quip":{"who":"GEORGE","text":"Density above one? That\'s me after a Sunday roast and four pints."}},"exercises":[{"type":"match","prompt":"Match the term to its meaning","pairs":[["Discrete","Values you count, like goals"],["Continuous","Values you measure, like time"],["PMF","Probability of each exact value"],["PDF","Density; area over a range gives probability"],["CDF","Probability of being at or below x"]],"explain":"Count vs measure is the cleanest line to use in an interview. PMF for counts, PDF for measurements, and the CDF works for both, climbing from 0 to 1."},{"type":"tf","statement":"For a continuous variable like height, P(height is exactly 178.000... cm) is zero.","answer":true,"explain":"Infinitely many decimals means any single exact point gets zero probability. Only ranges, like 177 to 179 cm, get positive probability. Sorry George, you\'re 178.3-something forever."},{"type":"mcq","prompt":"You\'re given the CDF of a continuous variable. How do you get the PDF?","options":["Integrate it from minus infinity to x","Take 1 minus the CDF","Differentiate it: the PDF is the slope of the CDF","Square it, then normalise so it sums to 1"],"answer":2,"explain":"The CDF is accumulated area, so its slope is the density. Steep CDF means probability packed in; flat CDF means density zero. Integrating goes the other way, PDF to CDF."},{"type":"fill","sentence":"A uniform distribution on [0, 0.5] has density ___ everywhere on that range.","options":["0.5","1","2","4"],"answer":"2","explain":"Total area must be 1. Width is 0.5, so height = 1 / 0.5 = 2. A density above 1 is perfectly legal; a probability above 1 is not."}]},{"concept":{"term":"Bernoulli and binomial","definition":"A Bernoulli is one yes/no trial: 1 with probability p, otherwise 0. A binomial counts the yeses in n independent trials that share the same p. Mean np, variance np(1−p).","analogy":"Bernoulli is one penalty. Binomial is how many you bury out of ten, as long as the keeper doesn\'t learn and your bottle doesn\'t go halfway through.","firm":{"name":"Meta","text":"Product data science interviews at firms like Meta lean hard on metrics. Clicks and conversions are Bernoulli per user, so totals are binomial, and that drives the error bars on every A/B test."},"interview":"\'How would you model whether a user converts?\' Strong: Bernoulli per user, binomial in total, then name the assumptions (independence, same p) and say when they break.","trap":"Forgetting the assumptions. If users share the ad with mates, trials aren\'t independent; if p varies by user, it isn\'t one binomial.","quip":{"who":"EMMA","text":"Variance np(1−p) peaks at p = 0.5. Maximum chaos, like George choosing a kebab."}},"exercises":[{"type":"mcq","prompt":"Which of these is best modelled as binomial?","options":["Minutes until the next user signs up","Sign-ups per day, with no fixed number of tries","Height of a randomly chosen user","How many of 50 users shown a banner click it"],"answer":3,"explain":"Fixed n, yes/no each time, same p, independent: binomial. Waiting time is exponential, uncapped counts in a window lean Poisson, and height is continuous."},{"type":"number","prompt":"An ad is shown to 100 people. Each clicks independently with probability 0.1. What is the standard deviation of the number of clicks?","answer":3,"tolerance":0,"unit":"clicks","explain":"Variance = np(1−p) = 100 × 0.1 × 0.9 = 9. SD = √9 = 3. So expect about 10 clicks, give or take 3."},{"type":"tf","statement":"For a fixed n, the binomial variance np(1−p) is largest when p = 0.5.","answer":true,"explain":"p(1−p) peaks at p = 0.5, where it equals 0.25. Near 0 or 1 the outcome is nearly certain, so there\'s little spread. A fair coin is as unpredictable as it gets."},{"type":"interview","question":"Meta-style screen: \'Our ad got 10,000 impressions and 200 clicks. How would you model the clicks?\'","options":[{"text":"Binomial with n = 10,000 and p = 0.02. Expected clicks are 200 and the variance is np(1−p), about 196.","verdict":"okay","why":"Correct maths, but no thought about whether the assumptions hold."},{"text":"Each impression is a Bernoulli, so clicks are roughly binomial with p ≈ 0.02. I\'d check independence, since repeat viewers break it, and whether p differs by segment.","verdict":"strong","why":"Names the model, estimates p, then stress-tests the assumptions."},{"text":"It\'s a big number, so it\'s normal. I\'d just report the 2% click-through rate.","verdict":"weak","why":"Skips the model entirely; normal is only an approximation to the binomial here."}],"answer":1,"explain":"Interviewers want the model plus its assumptions. A binomial needs independent trials with one shared p; real users repeat, share and differ."}]},{"concept":{"term":"Poisson and exponential","definition":"Poisson counts events in a fixed window when they happen independently at a steady average rate λ; mean and variance both equal λ. Exponential is the waiting time between those events, with mean 1/λ, and it\'s memoryless.","analogy":"Poisson counts the buses; exponential is how long you stand there freezing. Memoryless means the bus doesn\'t know you\'ve waited, like a text from someone who\'s ghosted you.","firm":{"name":"Spotify","text":"At streaming apps like Spotify, count metrics such as sign-ups per hour or skips per session are natural Poisson candidates. A strong analyst checks whether the variance is close to the mean before trusting it."},"interview":"\'Arrivals are Poisson, 3 per hour. Chance nobody arrives in 20 minutes?\' Strong: expected count is 1, so P(0) = e^(−1) ≈ 37%. Say each step out loud.","trap":"Thinking a long wait means the bus is \'due\'. Under an exponential model, time already waited tells you nothing about the extra wait.","quip":{"who":"GEORGE","text":"Overdispersion: way more mess than the mean predicted. Also my Sunday after a dodgy curry."}},"exercises":[{"type":"fill","sentence":"For a Poisson distribution, the variance equals the ___.","options":["mean","median","mean squared","square root of the mean"],"answer":"mean","explain":"Mean = variance = λ. If real count data has variance well above the mean, that\'s overdispersion; reach for something with extra spread, like a negative binomial."},{"type":"number","prompt":"Customers arrive as a Poisson process at 3 per hour. What is the probability, in %, that none arrive in the next 20 minutes? Nearest whole number.","answer":37,"tolerance":1,"unit":"%","explain":"20 minutes is a third of an hour, so λ = 3 × 1/3 = 1. P(0) = e^(−λ) = e^(−1) ≈ 0.368, about 37%."},{"type":"mcq","prompt":"Buses arrive as a Poisson process, on average every 10 minutes. You\'ve already waited 7. Expected extra wait?","options":["3 minutes","10 minutes","5 minutes","17 minutes"],"answer":1,"explain":"Exponential waits are memoryless, so the expected extra wait is still 10 minutes. Saying 3 is the gambler\'s fallacy. Real buses follow timetables, but in this model the past is irrelevant."},{"type":"tf","statement":"Goals in a football match are often modelled as Poisson, and it\'s an exact fit.","answer":false,"explain":"It\'s a decent first approximation, not exact: scoring rates shift with the scoreline, red cards and who\'s chasing. Say \'reasonable first model\' and you sound like you\'ve touched real data."}]},{"concept":{"term":"Uniform and normal","definition":"Uniform: every value in [a, b] equally likely, density 1/(b−a), mean (a+b)/2. Normal: a symmetric bell curve set by its mean and SD. About 68% lies within 1 SD, 95% within 2, 99.7% within 3.","analogy":"Uniform is the plumber arriving \'sometime between two and four\'. Normal is heights in a Wetherspoons: most blokes near average, a few lanky lads, a few short ones, nobody three metres tall.","firm":{"name":"G-Research","text":"Quant firms like G-Research hire heavily on probability. Expect quick normal-distribution sense checks, like what share lies beyond 2 SD, and Monte Carlo ideas that start from uniform random numbers."},"interview":"\'Why does the normal show up everywhere?\' Strong: many things are sums of lots of small independent effects, and sums tend to a bell curve (the CLT). Then flag where it fails.","trap":"Assuming every metric is normal. Times and spend can\'t go negative and are usually right-skewed, while a normal runs off to minus infinity.","quip":{"who":"EMMA","text":"68, 95, 99.7. Learn it like the kebab shop\'s number."}},"exercises":[{"type":"number","prompt":"Suppose adult heights are normal with mean 175 cm and SD 7 cm. Roughly what % are taller than 189 cm?","answer":2.5,"tolerance":0.5,"unit":"%","explain":"189 is 2 SD above the mean. About 95% sits within 2 SD, so 5% is outside, split equally between the tails: 2.5% above."},{"type":"match","prompt":"Match the term to its meaning","pairs":[["Within 1 SD","About 68% of a normal"],["Within 2 SD","About 95% of a normal"],["Within 3 SD","About 99.7% of a normal"],["Uniform[0, 1]","Every value in the range equally likely"],["Uniform density","1 / (b − a) across the range"]],"explain":"The 68-95-99.7 rule is your fastest sanity check on a normal. Uniforms are flat, so the height is just 1 over the width."},{"type":"tf","statement":"A uniform distribution on [2, 6] has mean 4 and density 0.25.","answer":true,"explain":"Mean is the midpoint, (2 + 6) / 2 = 4. Density is 1 / (6 − 2) = 0.25, so the rectangle has area exactly 1."},{"type":"mcq","prompt":"Why do Monte Carlo simulations usually start from uniform random numbers?","options":["Uniform numbers are more random than normal ones","Generators give Uniform(0,1); you transform them into the distribution you need","Most real-world quantities are uniformly distributed","Computers can\'t generate normal random numbers at all"],"answer":1,"explain":"Push a uniform through the inverse CDF and out comes your target distribution. That\'s the engine under Monte Carlo, including your drive-cycle simulations."}]},{"concept":{"term":"Mean, median, mode","definition":"Mean: add up, divide by the count. Median: the middle value once sorted (the 50th percentile). Mode: the most common value. Skew and outliers drag the mean towards the tail; the median barely moves, so it\'s robust.","analogy":"Seven skint lads in a pub. Bezos walks in. The mean person is now a billionaire; the median is still a lad with a kebab stain and £12 in his Monzo.","firm":{"name":"Google","text":"Big tech teams like Google\'s often report latency and engagement as percentiles, such as the median and 99th percentile, because a few extreme values wreck the mean. Expect \'mean or median?\' in product interviews."},"interview":"\'Average revenue per user: mean or median?\' Strong: depends on the decision. Mean for totals and forecasts, since mean × users = revenue; median for the typical user. Report both, plus percentiles.","trap":"Saying \'median, it\'s robust\', full stop. The mean is right when you care about totals, and the big spenders are real revenue.","quip":{"who":"GEORGE","text":"I asked the average person in the pub for a tenner. Wrong average, apparently."}},"exercises":[{"type":"order","prompt":"Salaries (£k): 20, 24, 24, 30, 40, 262. Order these from smallest to largest.","items":["Minimum","Mode","Median","Mean","Maximum"],"explain":"Mode 24, median (24 + 30) / 2 = 27, mean 400 / 6 ≈ 66.7. One £262k salary drags the mean way past the typical worker. Classic right skew: mode < median < mean."},{"type":"number","prompt":"Daily minutes on an app for six users: 3, 9, 1, 7, 100, 5. What is the median, in minutes?","answer":6,"tolerance":0,"unit":"minutes","explain":"Sort: 1, 3, 5, 7, 9, 100. Even count, so average the middle two: (5 + 7) / 2 = 6. The mean is 125 / 6 ≈ 20.8, hauled up by one heavy user."},{"type":"interview","question":"Big tech product screen: \'We report average revenue per user. Mean or median?\'","options":[{"text":"Median, because it\'s robust to outliers.","verdict":"weak","why":"Robotic. Ignores what the number is actually used for."},{"text":"Depends on the decision. For forecasting revenue, the mean, since mean × users = total. For the typical user, the median, since a few whales drag the mean up. I\'d report both plus percentiles.","verdict":"strong","why":"Ties the choice to the decision and knows about whales."},{"text":"Mean, because it uses all the data, but I\'d remove the outliers first so they don\'t distort it.","verdict":"okay","why":"Partly right, but deleting genuine whales throws away real revenue."}],"answer":1,"explain":"The killer phrase is \'it depends on the decision\'. Means add up to totals; medians describe a typical person. Big spenders are real customers, not errors."},{"type":"mcq","prompt":"When is the mode the natural \'average\' to report?","options":["Average daily spend per user","Typical house price in London","Expected goals per match","Most common payment method in a shop"],"answer":3,"explain":"You can\'t average \'card\' and \'Apple Pay\'. For categories, the mode is the only average that makes sense."}]},{"concept":{"term":"Spread, skew and fat tails","definition":"Variance is the average squared distance from the mean; SD is its square root, back in normal units. Skew measures lopsidedness: right skew means a long tail of big values. Fat tails mean extremes happen far more often than a normal predicts.","analogy":"The normal distribution is the mate who says \'relax, nothing bad ever happens on a night out\'. Fat tails are you in A&E at 3am anyway.","firm":{"name":"Man Group","text":"For quant managers like Man Group, fat-tailed returns are a core risk fact: a normal model badly underestimates how often crashes happen. Quant interviewers often probe why."},"interview":"\'Would you assume daily returns are normal?\' Strong: no, they\'re fat-tailed, so normal-based risk numbers, like those bank risk teams watch, understate crashes. Cite Black Monday 1987.","trap":"Treating a many-sigma day as impossible. With fat tails, \'never in the life of the universe\' moves turn up every few decades.","quip":{"who":"GEORGE","text":"Variance in minutes squared. That\'s how I measure my time on the bog with my phone."}},"exercises":[{"type":"fill","sentence":"If wait times are measured in minutes, the variance is in ___.","options":["minutes","minutes squared","seconds","no units"],"answer":"minutes squared","explain":"Squaring the deviations squares the units. That\'s why we take the square root: the SD is back in minutes, so you can say \'ten minutes, give or take three\'."},{"type":"tf","statement":"On Black Monday in October 1987, the Dow Jones fell by more than 20% in a single day.","answer":true,"explain":"It fell about 22.6%. Under a normal model with typical volatility, that\'s absurdly many SDs out, and it happened anyway. Say hello to fat tails."},{"type":"number","prompt":"Data: 2, 4, 4, 4, 5, 5, 7, 9. Dividing by n, what is the standard deviation?","answer":2,"tolerance":0,"explain":"Mean = 40 / 8 = 5. Squared deviations: 9, 1, 1, 1, 0, 0, 4, 16, total 32. Variance = 32 / 8 = 4, so SD = 2. Dividing by n − 1 instead gives √(32/7) ≈ 2.14."},{"type":"interview","question":"Bank risk team interview: \'Would you model daily stock returns as normal?\'","options":[{"text":"Roughly, yes. Returns look bell-shaped around the middle, so a normal is fine for most days.","verdict":"okay","why":"True near the centre, but risk lives in the tails."},{"text":"Yes. By the Central Limit Theorem, returns must be normally distributed.","verdict":"weak","why":"Misuses the CLT; fat tails and volatility clustering break the normal approximation."},{"text":"Not for risk. The middle looks bell-shaped, but returns are fat-tailed, so a normal badly underestimates crashes like Black Monday. I\'d check kurtosis and stress-test with heavier-tailed models or historical scenarios.","verdict":"strong","why":"Separates centre from tails and gives a concrete fix."}],"answer":2,"explain":"Risk teams live in the tails. A normal fits the boring days and lies about the days that sink you."}]}],"finale":[{"type":"interview","question":"Big tech data science screen: \'Describe the distribution of time users spend in our app per day.\'","options":[{"text":"Non-negative, so not normal: a spike near zero from quick opens, a long right tail, maybe bimodal. Report median and p90, keep the mean for totals, and check for sessions never closed.","verdict":"strong","why":"Shape, the right summary for each decision, and a data-quality check."},{"text":"Normal, with a mean of about 20 minutes. I\'d report the mean.","verdict":"weak","why":"Time can\'t be negative, the number is invented, and skew is ignored."},{"text":"Right-skewed, because some users spend hours, so I\'d report the median instead of the mean.","verdict":"okay","why":"Right shape, but misses the spike at zero, totals and data checks."}],"answer":0,"explain":"Shape first (bounded at zero, skewed), then the right summary for the decision, then data sanity. The 24-hour session from someone asleep on the bog with the app open is a real bug."},{"type":"number","prompt":"A/B test: three users each convert independently with probability 0.2. What is the probability, in %, that exactly one converts?","answer":38.4,"tolerance":0.5,"unit":"%","explain":"Binomial: 3 choose 1 × 0.2 × 0.8² = 3 × 0.2 × 0.64 = 0.384, so 38.4%. Forgetting the 3 orderings gives 12.8%, the classic slip."},{"type":"mcq","prompt":"A continuous variable on [0, 1] has CDF F(x) = x². What is its density at x = 0.9?","options":["0.81","0.9","1.8","1, since densities can\'t exceed 1"],"answer":2,"explain":"Density is the slope of the CDF: f(x) = 2x, so f(0.9) = 1.8. Above 1 and totally fine, because the area under 2x from 0 to 1 is still exactly 1."}],"teaser":"Tomorrow is quant day: market makers, spreads and adverse selection. Why the trade you\'re thrilled to get filled is often the one that screws you.","flashcards":[{"front":"What is a random variable? Discrete vs continuous?","back":"A number whose value depends on chance.<br>Discrete = you count it (goals, clicks). Continuous = you measure it (time, height).<br>Analogy: pints tonight is discrete; how long you\'re in the bog is continuous."},{"front":"PMF vs PDF","back":"<b>PMF</b>: probability of each exact value of a discrete variable; sums to 1.<br><b>PDF</b>: density of a continuous variable; area over a range is the probability.<br>Analogy: PDF is how rammed each bit of the Tube platform is; you need a stretch to count heads."},{"front":"What is a CDF?","back":"F(x) = P(X ≤ x). Rises from 0 to 1 and never goes down. Works for discrete and continuous. The median is where it hits 0.5, and its slope is the PDF.<br>Analogy: a progress bar to one."},{"front":"Bernoulli vs binomial","back":"<b>Bernoulli</b>: one yes/no trial, 1 with probability p.<br><b>Binomial</b>: number of yeses in n independent trials with the same p. Mean np, variance np(1−p).<br>Analogy: one penalty vs how many you score out of ten."},{"front":"What is a Poisson distribution?","back":"Count of events in a fixed window when they happen independently at a steady average rate λ. Mean = variance = λ.<br>Examples: goals per match, sign-ups per hour.<br>Variance much bigger than the mean = overdispersion."},{"front":"What is an exponential distribution?","back":"The waiting time between events in a Poisson process; mean 1/λ. It\'s memoryless: time already waited says nothing about the extra wait.<br>Analogy: Poisson counts the buses, exponential is how long you stand there freezing."},{"front":"The 68-95-99.7 rule","back":"For a normal: about 68% of values lie within 1 SD of the mean, 95% within 2 SD, 99.7% within 3 SD.<br>So about 2.5% lies above +2 SD and 2.5% below −2 SD."},{"front":"Mean vs median vs mode","back":"<b>Mean</b>: sum ÷ count, dragged by outliers.<br><b>Median</b>: middle value, robust.<br><b>Mode</b>: most common value, works for categories.<br>Analogy: Bezos walks into a pub. The mean goes billionaire; the median stays skint."},{"front":"What is skew?","back":"Lopsidedness of a distribution. Right skew = long tail of big values (salaries, time on app), and usually mean > median.<br>Analogy: the tail drags the mean off like a drunk mate wandering to the kebab shop."},{"front":"What are fat tails? What is kurtosis?","back":"Fat tails: extreme values happen far more often than a normal predicts. Kurtosis measures how heavy the tails are.<br>Daily stock returns are fat-tailed: on Black Monday 1987 the Dow fell about 22.6% in one day."},{"front":"Interview: Can a probability density be greater than 1?","back":"Yes. A density isn\'t a probability; only area under it is. Uniform on [0, 0.5] has density 2 everywhere and still integrates to 1.<br>Trap: saying \'the PDF gives the probability of a value\'. Exact points have probability 0."},{"front":"Interview: Given a CDF, how do you get the PDF?","back":"Differentiate it: the PDF is the slope of the CDF. Steep CDF means lots of probability packed in; flat means density zero.<br>Example: F(x) = x² on [0, 1] gives f(x) = 2x."},{"front":"Interview: How would you model whether a user converts, and total conversions?","back":"Bernoulli per user, binomial for the total: mean np, variance np(1−p). Then check the assumptions: independent users and a shared p.<br>Trap: ignoring sharing, repeat users or segments with different p."},{"front":"Interview: Arrivals are Poisson at 3 per hour. P(no arrivals in the next 20 minutes)?","back":"Expected count in 20 minutes is 3 × 1/3 = 1. P(0) = e^(−1) ≈ 0.37, so about 37%."},{"front":"Interview: Buses arrive as a Poisson process every 10 minutes on average. You\'ve waited 10. Expected extra wait?","back":"Still 10 minutes: exponential waits are memoryless.<br>Trap: \'it must be due\' is the gambler\'s fallacy. Mention that real buses follow timetables, so this is a model assumption."},{"front":"Interview: What distribution would you use for daily sign-ups, and how would you check it?","back":"Poisson is a natural first model for counts at a roughly steady rate. Check whether the variance is close to the mean. If it\'s much bigger (overdispersion), try a negative binomial."},{"front":"Interview: Average revenue per user: mean or median?","back":"Depends on the decision. Mean for totals and forecasts (mean × users = revenue). Median for the typical user, since whales drag the mean up. Report both plus percentiles.<br>Trap: \'median, it\'s robust\', full stop."},{"front":"Interview: Why does the normal distribution show up so often?","back":"Many quantities are sums of lots of small independent effects, and sums tend towards a bell curve (Central Limit Theorem).<br>Trap: forgetting where it fails: bounded, skewed or fat-tailed data like times, money and returns."},{"front":"Interview: Would you model daily stock returns as normal?","back":"Not for risk. Returns are fat-tailed, so a normal underestimates crashes like Black Monday 1987. Check kurtosis and stress-test with heavier-tailed models or historical scenarios.<br>Trap: \'the CLT makes them normal\'."},{"front":"Interview: Describe the distribution of time users spend in our app per day.","back":"Non-negative, so not normal: a spike near zero, a long right tail, maybe log-normal or bimodal. Report the median and p90, keep the mean for totals, and check for sessions that never closed."}]}');var eu={};eu=JSON.parse('{"id":"w1d4","week":1,"day":4,"track":"quant","title":"Who Makes the Market","subtitle":"Market makers, P and L, and the industry","intro":[{"who":"GEORGE","text":"Emma, I\'m starting a sock stall. Buy at a quid, sell at two. Literally cannot lose."},{"who":"EMMA","text":"Until the bloke selling you socks knows they\'ve all got holes in. Congratulations, you\'ve invented adverse selection."},{"who":"GEORGE","text":"Mugged by socks. Classic Thursday."},{"who":"EMMA","text":"Today: who makes markets, how they get mugged, how to count your P and L, and who\'s who in the industry."},{"who":"GEORGE","text":"So by the end, Sam won\'t tell Jane Street he loves their pension fund?"}],"units":[{"concept":{"term":"Market maker","definition":"A firm that constantly quotes both a bid and an offer, ready to buy from sellers and sell to buyers. It aims to earn the spread over huge volume, often helped by exchange rebates, while managing inventory risk.","analogy":"CeX for shares. They buy your old Xbox for eighty quid and flog it for one-twenty. They don\'t care if Xbox is any good, they just want stuff flowing through.","firm":{"name":"Optiver","text":"Optiver, IMC and Flow Traders are market makers: they quote prices on exchanges all day across thousands of products. Their interviews lean hard on quick maths, probability and making markets, because that is the actual job."},"interview":"Asked \'how does a market maker make money?\' Strong: earn the spread across volume, plus rebates, minus losses to informed traders and inventory moves. Weak: \'buy low, sell high\'.","trap":"Thinking the spread is free money. It\'s mostly payment for risk, especially the risk the other side knows more than you.","quip":{"who":"GEORGE","text":"So they stand there all day shouting \'buying AND selling!\' like my uncle at a car boot sale."}},"exercises":[{"type":"mcq","prompt":"A market maker\'s basic way of making money is...","options":["Buying at the bid, selling at the offer, earning the spread","Predicting which companies will grow over ten years","Charging clients a yearly management fee","Lending its shares out for interest"],"answer":0,"explain":"Buy at the bid, sell at the offer, pocket the gap, repeat millions of times. Long-term stock picking and management fees are the buy side\'s game."},{"type":"fill","sentence":"Many exchanges pay market makers a ___ for posting quotes that add liquidity.","options":["rebate","dividend","margin","coupon"],"answer":"rebate","explain":"Exchanges want a full order book, so many reward liquidity providers with rebates or cheaper fees, often in return for keeping quotes up. Dividends and coupons come from companies and bonds."},{"type":"number","prompt":"You quote 99 bid, 100 offer. You buy 500 at 99 and sell 500 at 100. Imagine the exchange pays a 0.2p rebate per share on each passive fill. Total profit?","answer":700,"tolerance":0,"unit":"pence","explain":"Spread: 500 × 1p = 500p. Rebate: 1,000 shares filled × 0.2p = 200p. Total 700p, or £7. Tiny per share, which is why volume is everything."},{"type":"tf","statement":"Inventory risk is the risk that the price moves against the position you\'re stuck holding before you can offload it.","answer":true,"explain":"You bought at 99, the price drops to 95 before anyone buys from you. The spread you earned is now a rounding error next to the loss."}]},{"concept":{"term":"Adverse selection","definition":"The risk that the people who choose to trade with you are the ones who know more than you. So getting filled is itself information, and on average it\'s bad news for the price you quoted.","analogy":"A stranger in the club offers you his drink ticket at half price. Is he just going home, or does he know the bar shut ten minutes ago?","firm":{"name":"Jane Street","text":"Market makers like Jane Street are widely reported to use market-making games in interviews. The interviewer often knows more than you, so their trades are clues. Spotting that out loud is the whole point."},"interview":"When the interviewer keeps trading one way, say it: \'they keep lifting me, fair is probably higher, I\'m moving my prices up.\' Weak candidates keep quoting the same numbers.","trap":"Celebrating every fill because you \'earned the spread\'. A fill is a clue, not a pat on the back.","quip":{"who":"EMMA","text":"A fill isn\'t a pat on the back. Sometimes it\'s a punch in the bollocks."}},"exercises":[{"type":"tf","statement":"If someone is desperate to buy everything on your offer, that\'s probably good news for you.","answer":false,"explain":"Desperate buyers often know something. If they\'re right, the price rises and you\'re short at the old, cheap price. Eager counterparties are a warning light."},{"type":"mcq","prompt":"A big fund hits your bid on huge size, right after publishing research on the stock. Most likely?","options":["They think it\'s worth less than your bid","They think it\'s worth more than your offer","They need cash and the trade means nothing","Big trades never carry information"],"answer":0,"explain":"They sold to you, so they probably think the price is going down. Sometimes it really is just a cash need, but you can\'t assume that. Assume the worst, update."},{"type":"interview","question":"Why do market makers widen their spreads just before big news, like earnings?","options":[{"text":"Because the price could move a lot, so holding anything is riskier.","verdict":"okay","why":"True, but only covers inventory risk. Misses informed traders."},{"text":"Uncertainty spikes and informed traders are more likely, so adverse selection rises. A wider spread pays for that risk, and quoting smaller size limits the damage until the news lands.","verdict":"strong","why":"Names both risks and gives concrete actions: wider and smaller."},{"text":"To squeeze extra profit out of clients while everyone\'s distracted.","verdict":"weak","why":"Treats the spread as greed, not payment for risk."}],"answer":1,"explain":"Break \'risk\' into pieces: bigger moves (inventory risk) and more people who know more than you (adverse selection). Then say what you\'d do."},{"type":"fill","sentence":"You keep getting lifted on your offer, so fair value is probably ___ than you thought.","options":["higher","lower","exactly the same"],"answer":"higher","explain":"Lifted means they bought from you. Repeated buying suggests they think it\'s worth more. Move both your bid and offer up."}]},{"concept":{"term":"Positions and P and L","definition":"Long: you profit if the price rises. Short: you profit if it falls. Flat: no position. P and L is profit and loss. Mark to market means valuing what you hold at today\'s price, not what you paid.","analogy":"Mark to market is stepping on the gym scales every morning. You can\'t claim you\'re still your August weight because you haven\'t \'officially sold\' the extra.","firm":{"name":"IMC","text":"At market makers like IMC, traders watch positions and P and L live all day. Interviews often fire a sequence of trades at you, then ask for your position and P and L at the end."},"interview":"\'Buy 10 at 50, sell 4 at 52, market\'s at 49. P and L?\' Strong: +8 on the four sold, minus 6 on the six held, total +2, long 6.","trap":"Forgetting the shares you still hold. \'It\'s only a loss if I sell\' is the crypto bro lie.","quip":{"who":"GEORGE","text":"Long, short and flat. Also the three reviews from my last three dates."}},"exercises":[{"type":"match","prompt":"Match the term to its meaning","pairs":[["Long","You profit if the price goes up"],["Short","You profit if the price goes down"],["Flat","No position at all"],["Mark to market","Value holdings at today\'s market price"],["P and L","Running total of profit and loss"]],"explain":"Flat is the only state where a price move can\'t hurt you. Traders often
