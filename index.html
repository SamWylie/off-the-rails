d compare retention.","verdict":"strong","why":"Names the confounder and the fix: randomisation."},{"text":"Maybe. Correlation isn\'t causation, so I\'d be careful before deciding anything.","verdict":"okay","why":"Right instinct, but no mechanism and no plan."}],"answer":1,"explain":"Strong answers say why the link could be fake and how to test it. Randomisation breaks confounding because keenness can\'t pick who gets the feature."},{"type":"order","prompt":"Order the steps of a strong live coding answer","items":["Clarify inputs and edge cases","State brute force and its complexity","Find what\'s repeated and optimise","Code it while talking","Test with edge cases, state final complexity"],"explain":"Clarify, baseline, optimise, code, test. Jumping straight to code is like skipping foreplay: fast, awkward, and nobody\'s impressed."}]},{"concept":{"term":"Room 6: Hard mode","definition":"1) Track position through every fill, then mark to market. 2) Sample SD is still biased low, even with n minus 1. 3) Comparison sorts can\'t beat O(n log n). 4) Growing an array by a fixed amount makes appends O(n) each on average.","analogy":"Hard mode is the pub quiz after six pints: same questions, but now every detail you skipped comes back to bite you on the arse.","firm":{"name":"G-Research","text":"G-Research is a London quant research firm. Research roles there, as at most quant funds, tend to probe depth: why an estimator is biased, what an assumption breaks, how a result changes with more data."},"interview":"Expect \'always?\' after every claim. Strong candidates pre-empt it: \'average O(1), worst case O(n)\', \'unbiased for variance, not for SD\'.","trap":"Stopping at the first true-sounding answer. Hard mode rewards the caveat.","quip":{"who":"EMMA","text":"Every \'always\' you say in hard mode is a bid you\'ve left in the book. Someone will hit it."}},"exercises":[{"type":"number","prompt":"You\'re flat, quoting 99 at 100. Lifted on 5, hit on 3, lifted on 4. Market moves to 101. Your P and L?","answer":-3,"tolerance":0,"explain":"Sold 9 at 100 (+900), bought 3 at 99 (-297): cash +603. You\'re short 6, worth -606 at 101. Total -3. You earned spread but the flow was informed."},{"type":"mcq","prompt":"You compute sample variance with n minus 1 and take the square root. Is that SD unbiased?","options":["No, the square root makes it slightly biased low","Yes, n minus 1 removes all bias","No, it\'s biased high","Only if the data are normal"],"answer":0,"explain":"Variance with n minus 1 is unbiased, but the square root is concave, so on average it undershoots the true SD. Even for normal data. Mention it and look sharp."},{"type":"tf","statement":"A Python dict lookup can degrade to O(n) if many keys collide.","answer":true,"explain":"Pile everything into one region of the table and lookups crawl. Honest answer: O(1) on average with a decent hash and resizing, O(n) worst case."},{"type":"fill","sentence":"No comparison-based sort can beat ___ in the worst case.","options":["O(n log n)","O(n)","O(log n)","O(n squared)"],"answer":"O(n log n)","explain":"It\'s a proven lower bound. Want faster? Only without comparisons, like counting sort for small integers in a known range, which can hit linear time."}]}],"finale":[{"type":"mcq","prompt":"A dynamic array grows by a fixed 10 slots whenever it\'s full. Total cost of n appends?","options":["O(n squared)","O(n)","O(n log n)","O(1)"],"answer":0,"explain":"About n/10 resizes, each copying up to n items: total about n squared over 20, so O(n squared). Only growing by a constant factor, like doubling, gives amortised O(1)."},{"type":"market","title":"Two cards from ten","intro":"Ten cards numbered 1 to 10. Two are drawn without replacement. Make me a market on their sum.","steps":[{"reveal":"Nothing revealed yet. Quote your first market.","fair":11,"sd":3.8,"explain":"Each card averages 5.5, so fair is 11. Without replacement the cards are slightly negatively correlated, so sd is about 3.8. Something like 9 at 13 is sensible."},{"reveal":"The first card is a 9.","fair":14.11,"sd":2.8,"explain":"The other card is uniform on the remaining 1 to 8 and 10: average 46/9 ≈ 5.11. Fair is 9 + 46/9 ≈ 14.11, sd about 2.8. Move your whole market up."},{"reveal":"The second card is bigger than 5.","fair":16.75,"sd":1.5,"explain":"Second card is 6, 7, 8 or 10: average 7.75. Fair 9 + 7.75 = 16.75, sd about 1.5. Less uncertainty, so tighten: something like 16 at 17.5."}]},{"type":"interview","question":"You quote 99 at 100 in a small stock. Your bid gets hit four times in a row, big size. Talk me through what you do.","options":[{"text":"Great, I\'ve bought at 99 four times, so I\'m earning the spread. I\'ll keep the same quote and wait for buyers.","verdict":"weak","why":"Ignores the long position and adverse selection."},{"text":"I\'m now long a lot. Repeated selling is information, so fair is probably lower. I\'d move both prices down, maybe widen, check news and related products, and watch my risk limit.","verdict":"strong","why":"Position, information, update, risk: all said out loud."},{"text":"I\'d widen my spread to be safer until things calm down.","verdict":"okay","why":"Sensible, but no position and no move in fair value."}],"answer":1,"explain":"Got hit = you bought. Persistent selling on size smells informed, so lower your fair, skew prices down to offload, and mind your limits. A fill can be a punch in the face."}],"teaser":"Next week: Making Markets properly (fair value, edge, inventory and skew), trees and graphs, and hypothesis testing. Bring a helmet.","flashcards":[{"front":"You\'re quoting and someone says \'you got lifted on 50\'. What\'s your position?","back":"You sold 50. Someone bought your offer, so you\'re now short 50 (from flat).<br>Trap: \'lifted\' describes what they did to your quote. Lifted = it left you."},{"front":"Market buy for 800 when offers are 300 at 100 and 500 at 101. What happens?","back":"You fill 300 at 100, then 500 at 101. Average 100.625. The best offer only holds for the size shown; beyond that you walk the book.<br>Trap: saying all 800 at 100."},{"front":"Why does a small company\'s stock have a wider spread than a big bank\'s?","back":"Three reasons: less competition between market makers, harder to exit a position (inventory risk), and more chance the counterparty knows more (adverse selection).<br>Trap: \'because it\'s riskier\', full stop."},{"front":"What is adverse selection?","back":"The people most keen to trade with you are more likely to know something you don\'t, so a fill is itself information.<br>Analogy: a stranger selling a half-price drink ticket because they know the bar just shut."},{"front":"You quote 99/100 and get lifted five times on big size. What do you do?","back":"Say your position: short a lot. Repeated buying is information, so fair is probably higher. Move prices up, maybe widen, check news and related products, mind your risk limit."},{"front":"Buy 10 at 50, sell 4 at 52, market now 49. Position and P and L?","back":"Long 6. The 4 sold made +8. The 6 held are marked at 49, down 1 each: -6. Total +2.<br>Trap: forgetting to mark the open position to market."},{"front":"Prop shop vs hedge fund vs bank?","back":"Prop shops (Jane Street, Optiver) trade their own money, often as market makers. Hedge funds (Two Sigma, Man Group) mostly manage investors\' money. Banks (Goldman, JPMorgan) serve clients.<br>Waiter (sell side) vs customer (buy side)."},{"front":"What\'s the difference between Citadel and Citadel Securities?","back":"Separate companies with the same founder. Citadel is a multi-strategy hedge fund; Citadel Securities is a market maker. Mixing them up in \'why us\' shows zero research."},{"front":"Quant trader vs researcher vs developer?","back":"Trader: makes real-time pricing and risk decisions. Researcher: finds and tests predictive signals in data. Developer: builds the fast, reliable trading and research systems.<br>Striker, scout, groundsman."},{"front":"What is the time and space complexity of your solution? (asked after every coding question)","back":"Give both, with the why: \'O(n) time, one pass with O(1) average hash map operations; O(n) extra space for the map.\' Mention worst case if it differs.<br>Trap: \'it\'s quite fast\'."},{"front":"Solve two sum. What\'s the optimal approach?","back":"One pass with a hash map of value to index. For each x, check if target minus x is already in the map; if not, store x. O(n) time, O(n) space. Mention the O(n squared) brute force first."},{"front":"Is a hash map lookup O(1)?","back":"O(1) on average, with a decent hash function and resizing to keep the load factor down. Worst case O(n) if keys collide. Resizes are rare, so inserts are amortised O(1).<br>Lockers analogy."},{"front":"Is appending to a Python list O(1)?","back":"Amortised O(1). A single append can be O(n) when the list resizes, but capacity grows by a constant factor, so n appends cost O(n) total.<br>Trap: growing by a fixed amount breaks this."},{"front":"Array vs linked list?","back":"Array: O(1) index access, cache-friendly, O(n) insert in the middle. Linked list: O(1) insert once you\'re at the node, but O(n) to find it, and poor cache use.<br>Terraced houses vs a treasure hunt."},{"front":"Stack vs queue, and when do you use each?","back":"Stack is LIFO: call stack, undo, bracket matching. Queue is FIFO: job queues, breadth-first search. In Python use a deque for queues.<br>Trap: list.pop(0) is O(n). Your gut is a queue."},{"front":"We\'re reporting revenue per user. Mean or median?","back":"Depends on the decision. Median for a typical user, since whales drag the mean. Mean when you need totals, since mean x users = total. Ideally report both plus percentiles."},{"front":"Why does sample variance divide by n minus 1?","back":"Deviations are measured from the sample mean, which is fitted to the same data, so they look too small. Dividing by n minus 1 corrects that, making it unbiased. One degree of freedom is spent on the mean.<br>Bonus: the SD is still slightly biased low."},{"front":"Law of Large Numbers vs Central Limit Theorem?","back":"LLN: the sample average closes in on the true mean as n grows (where). CLT: the average\'s distribution becomes roughly normal (what shape).<br>Trap: the CLT doesn\'t make raw data normal. And no, roulette doesn\'t \'even out\'."},{"front":"Our A/B test is too noisy. How much more data to halve the standard error?","back":"Four times as much. SE = sd divided by root n, so halving it needs n x 4. A tenth of the error needs 100 times the data.<br>Diminishing returns, like gains in the gym."},{"front":"Users of feature X retain better. Should we push everyone onto X?","back":"Not yet. Keen users may both find X and stay anyway: a confounder. Run an A/B test, randomly assigning X, to see if it causes retention.<br>Ice cream and drownings: hot weather drives both."}]}');let ep=[t(ei),t(es),t(el),t(eu),t(ec),t(ed),t(eh)];function ef(){let e=new Map;for(let t of ep)e.set(t.id,t);for(let t of V().packs)e.set(t.id,t);return[...e.values()].sort((e,t)=>e.week-t.week||e.day-t.day)}let em={quant:{name:"Quant",color:"#0E9F6E",dark:"#08754F",soft:"#D9F5E8",emoji:"📈"},swe:{name:"Software",color:"#2563EB",dark:"#1A47AE",soft:"#DCE7FD",emoji:"💻"},ds:{name:"Data Science",color:"#E8504B",dark:"#B7332F",soft:"#FDE1DF",emoji:"📊"},boss:{name:"Boss Battle",color:"#1B1B1B",dark:"#000000",soft:"#FFE9A8",emoji:"💀"}};var l=o("aIIwE");let eg={name:"x",size:24,node:[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]};eg.node;let ey=f(eg);var l=o("aIIwE");let eb={go:"bg-[#0E9F6E] border-[#08754F] text-white",ink:"bg-[#1B1B1B] border-black text-white",ghost:"bg-white border-[#E3DACA] text-[#1B1B1B]",bad:"bg-[#E8504B] border-[#B7332F] text-white",gold:"bg-[#FFC233] border-[#D39A12] text-[#1B1B1B]",blue:"bg-[#2563EB] border-[#1A47AE] text-white"};function ev({tone:e="go",className:t="",children:n,...a}){return(0,s.jsx)("
